name: Checks
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: '12.18.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.13.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check:all
      - run: node packages/connector/dist/cli.js --version
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker build -f apps/farm/Dockerfile -t open3dfarmmanager-test .
      - run: |
          docker run -d --name farm-test --read-only --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:3100:3000 open3dfarmmanager-test
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:3100/healthz; then exit 0; fi
            sleep 1
          done
          docker logs farm-test
          exit 1
      - if: always()
        run: docker rm -f farm-test || true
