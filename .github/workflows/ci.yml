name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - run: npm ci --ignore-scripts
      - run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/postgresql-pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql-pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y postgresql-common
          sudo sed -i 's/^#\? *create_main_cluster.*/create_main_cluster = false/' /etc/postgresql-common/createcluster.conf
          sudo apt-get install -y postgresql-17
      - run: bash scripts/test-local-ci.sh
      - run: npm run check:all
      - run: node packages/connector/dist/cli.js --version
  code-node22:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.5'
      - run: npm ci --ignore-scripts
      - run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/postgresql-pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql-pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y postgresql-common
          sudo sed -i 's/^#\? *create_main_cluster.*/create_main_cluster = false/' /etc/postgresql-common/createcluster.conf
          sudo apt-get install -y postgresql-17
      - run: bash scripts/test-local-ci.sh
      - run: npm run check:all
      - run: node packages/connector/dist/cli.js --version
  camera-ffmpeg-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: npm ci --ignore-scripts
      - run: node --test tests/node/anycubic-camera.test.ts tests/node/bambu-camera.test.ts
        env:
          OPENFARM_CAMERA_FFMPEG_QUALIFY: '1'
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          OPENFARM_BROWSER: bundled
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker build -f packages/connector/Dockerfile -t open3dfarmmanager-connector-test .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.5'
      - run: node --test tests/docker/connector-image.test.ts
        env:
          CONNECTOR_TEST_IMAGE: open3dfarmmanager-connector-test
      - run: docker build -f apps/farm/Dockerfile -t open3dfarmmanager-test .
      - run: |
          docker run -d --name farm-test --read-only --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:3100:3000 open3dfarmmanager-test
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:3100/healthz; then exit 0; fi
            sleep 1
          done
          docker logs farm-test
          exit 1
      - if: always()
        run: docker rm -f farm-test || true
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.5'
      - run: npm ci --ignore-scripts
      - name: Install PostgreSQL 17 binaries
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/postgresql-pgdg.gpg
          echo 'deb [signed-by=/usr/share/keyrings/postgresql-pgdg.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-common
          sudo sed -i 's/^#\? *create_main_cluster.*/create_main_cluster = false/' /etc/postgresql-common/createcluster.conf
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-17
      - run: |
          set -o pipefail
          npm run test:postgres 2>&1 | tail -c 200000
        env:
          OPENFARM_PG_BIN: /usr/lib/postgresql/17/bin
