name: Checks
on: [workflow_dispatch]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - run: npm ci --ignore-scripts
      - run: bash scripts/test-local-ci.sh
      - run: npm run check:all
      - run: node packages/connector/dist/cli.js --version
      - run: npm run test:e2e
  code-node22:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.5'
      - run: npm ci --ignore-scripts
      - run: bash scripts/test-local-ci.sh
      - run: npm run check:all
      - run: node packages/connector/dist/cli.js --version
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker build -f apps/farm/Dockerfile -t open3dfarmmanager-test .
      - run: |
          docker run -d --name farm-test --read-only --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:3100:3000 open3dfarmmanager-test
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:3100/healthz; then exit 0; fi
            sleep 1
          done
          docker logs farm-test
          exit 1
      - if: always()
        run: docker rm -f farm-test || true
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
      - run: npm ci --ignore-scripts
      - run: |
          set -o pipefail
          npm run test:postgres 2>&1 | tail -c 200000
