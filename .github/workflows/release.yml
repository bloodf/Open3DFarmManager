name: Release

on:
  workflow_dispatch:
    inputs:
      owner_approved:
        description: Confirm the owner approved publication
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.5'
      - name: Read release version
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
      - name: Rehearse upgrade and build Linux amd64 release archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/build-release.sh "$VERSION" release-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-v${{ steps.version.outputs.version }}
          path: release-artifacts/
          if-no-files-found: error

  publish:
    needs: build
    if: inputs.owner_approved && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-v${{ needs.build.outputs.version }}
          path: release-artifacts
      - name: Publish versioned images and release
        working-directory: release-artifacts
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum -c SHA256SUMS
          tag="v$VERSION"
          matching_refs=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq '.[].ref')
          if grep -Fxq "refs/tags/$tag" <<< "$matching_refs"; then
            echo "Tag $tag already exists" >&2
            exit 1
          fi
          registry="ghcr.io/${GH_REPO,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for component in farm connector; do
            docker load -i "$component-$tag-image.tar.gz"
            docker tag "openfarm-$component:$tag" "$registry/$component:$tag"
            docker push "$registry/$component:$tag"
          done
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" --silent
          gh release create "$tag" --verify-tag --generate-notes \
            farm-"$tag"-image.tar.gz connector-"$tag"-image.tar.gz \
            connector-"$tag"-linux-amd64.tar.gz SHA256SUMS
