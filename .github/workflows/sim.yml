name: Simulator
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  klipper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: docker compose -f infra/sim/docker-compose.yml --profile klipper config --quiet
      - run: docker compose -f infra/sim/docker-compose.yml --profile klipper up -d
      - id: smoke
        run: bun run sim:smoke
      - if: failure()
        run: node scripts/klipper-diagnostics.mjs
      - id: baseline_cleanup
        if: always()
        run: docker compose -f infra/sim/docker-compose.yml --profile klipper down
      - name: Compare simulator CPU limits
        if: failure() && steps.smoke.outcome == 'failure' && steps.baseline_cleanup.outcome == 'success'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          project=open3dfarmmanager-cpu-diagnostic
          compose=(docker compose -p "$project" -f infra/sim/docker-compose.yml -f infra/sim/docker-compose.cpu-diagnostic.yml --profile klipper)
          cleanup() {
            status=$?
            trap - EXIT
            timeout --kill-after=5s 45s "${compose[@]}" down --volumes --remove-orphans || status=1
            exit "$status"
          }
          trap cleanup EXIT
          timeout --kill-after=5s 45s "${compose[@]}" up -d
          status=0
          timeout --kill-after=5s 110s bun run sim:smoke || status=$?
          timeout --kill-after=5s 60s node scripts/klipper-diagnostics.mjs "$project" || status=1
          exit "$status"
