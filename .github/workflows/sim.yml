name: Simulator
on: [workflow_dispatch]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mock:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.5'
      - run: npm ci --ignore-scripts
      - name: Verify loopback mocks
        shell: bash
        run: |
          set -o pipefail
          mkdir -p sim-diagnostics
          node --test tests/node/e16-358.test.mjs 2>&1 | tail -c 200000 | tee sim-diagnostics/mock.log
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sim-mock-${{ matrix.arch }}
          path: sim-diagnostics/
          retention-days: 7
          if-no-files-found: ignore
  klipper:
    if: github.event_name == 'workflow_dispatch'
    env:
      OPENFARM_SIM: docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.5'
      - run: npm ci --ignore-scripts
      - run: docker compose -f infra/sim/docker-compose.yml --profile klipper config --quiet
      - name: Build native Klipper image
        shell: bash
        run: |
          set -o pipefail
          mkdir -p sim-diagnostics
          docker build --platform linux/${{ matrix.arch }} -t openfarm-klipper:sim infra/sim/klipper 2>&1 | tail -c 200000 | tee sim-diagnostics/build.log
      - run: docker compose -f infra/sim/docker-compose.yml --profile klipper up -d --no-build
      - name: Verify Klipper simulator
        run: npm run sim:smoke
      - if: failure()
        run: |
          mkdir -p sim-diagnostics
          node scripts/klipper-diagnostics.mjs | tail -c 200000 > sim-diagnostics/klipper.log
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sim-klipper-${{ matrix.arch }}
          path: sim-diagnostics/
          retention-days: 7
          if-no-files-found: ignore
      - if: always()
        run: docker compose -f infra/sim/docker-compose.yml --profile klipper down
  spoolman:
    if: github.event_name == 'workflow_dispatch'
    env:
      OPENFARM_SIM: docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.5'
      - run: npm ci --ignore-scripts
      - if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: amd64
      - run: docker compose -f infra/sim/docker-compose.yml --profile spoolman config --quiet
      - run: docker compose -f infra/sim/docker-compose.yml --profile spoolman up -d
      - name: Seed and verify Spoolman
        run: |
          set -o pipefail
          curl -fsS -o /dev/null --retry 30 --retry-all-errors --retry-delay 2 --retry-max-time 90 --max-time 3 http://127.0.0.1:7912/api/v1/health
          npm run sim:seed
          node packages/sim-tools/src/spoolman-cli.ts 2>&1 | tee /tmp/sim-spoolman.log | tail -c 200000
      - if: failure()
        run: node scripts/sim-profile-diagnostics.mjs spoolman sim-diagnostics/spoolman-${{ matrix.arch }}.json
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sim-spoolman-${{ matrix.arch }}
          path: sim-diagnostics/
          retention-days: 7
          if-no-files-found: ignore
      - if: always()
        run: docker compose -f infra/sim/docker-compose.yml --profile spoolman down
  cams:
    if: github.event_name == 'workflow_dispatch'
    env:
      OPENFARM_SIM: docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.5'
      - run: npm ci --ignore-scripts
      - run: docker compose -f infra/sim/docker-compose.yml --profile cams config --quiet
      - run: docker compose -f infra/sim/docker-compose.yml --profile cams up -d --build
      - name: Verify cams JPEG
        run: |
          set -o pipefail
          node packages/sim-tools/src/camera-cli.ts 2>&1 | tee /tmp/sim-cams.log | tail -c 200000
      - if: failure()
        run: node scripts/sim-profile-diagnostics.mjs cams sim-diagnostics/cams-${{ matrix.arch }}.json
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sim-cams-${{ matrix.arch }}
          path: sim-diagnostics/
          retention-days: 7
          if-no-files-found: ignore
      - if: always()
        run: docker compose -f infra/sim/docker-compose.yml --profile cams down
  rtsp:
    if: github.event_name == 'workflow_dispatch'
    env:
      OPENFARM_SIM: docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.5'
      - run: npm ci --ignore-scripts
      - run: docker compose -f infra/sim/docker-compose.yml --profile rtsp config --quiet
      - run: docker compose -f infra/sim/docker-compose.yml --profile rtsp up -d
      - name: Verify RTSP
        run: |
          set -o pipefail
          npm run sim:verify:rtsp 2>&1 | tee /tmp/sim-rtsp.log | tail -c 200000
      - if: failure()
        run: node scripts/sim-profile-diagnostics.mjs rtsp sim-diagnostics/rtsp-${{ matrix.arch }}.json
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sim-rtsp-${{ matrix.arch }}
          path: sim-diagnostics/
          retention-days: 7
          if-no-files-found: ignore
      - if: always()
        run: docker compose -f infra/sim/docker-compose.yml --profile rtsp down
