name: Simulator
on: [workflow_dispatch]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  klipper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: '12.18.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.2'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: docker compose -f infra/sim/docker-compose.yml --profile klipper config --quiet
      - run: docker compose -f infra/sim/docker-compose.yml --profile klipper up -d
      - run: pnpm run sim:smoke
      - if: failure()
        run: node scripts/klipper-diagnostics.mjs
      - if: always()
        run: docker compose -f infra/sim/docker-compose.yml --profile klipper down
