        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /inventory:
    get:
      operationId: listInventory
      tags: [Inventory]
      summary: Latest Spoolman inventory snapshots
      description: |
        One entry per Connector that reported a snapshot, for farms covered by
        a farm-wide `inventory:read` grant. Snapshots are read-only display evidence.
        Connectors upload a bounded display projection through authenticated
        telemetry (at most 8 spools, with no Spoolman credentials). The server
        returns the latest observation per Connector. Pagination uses a stable
        farm and Connector keyset. The Spoolman a Connector reads is set by the
        farm owner or an administrator in the pt-BR Spoolman page, or in the
        Connector's local configuration; its address and credentials are never
        part of this API, and the credentials never leave the Connector.
      security:
        - clientCredentials: ['inventory:read']
      parameters:
        - $ref: '#/components/parameters/FarmIdFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of inventory snapshots.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /inventory/spools:
    get:
      operationId: listObservedSpools
      tags: [Inventory]
      summary: Page spool observations from Connector snapshots
      description: |
        Requires a farm-wide inventory grant. Each observation is bounded;
        partial snapshots omit spools and updates may change page membership.
        Use `spoolKey` to identify a spool across Connector changes. A service
        replacement needs a new service UUID, including at the same address.
        Legacy observations may omit the service identity.
      security:
        - clientCredentials: ['inventory:read']
      parameters:
        - $ref: '#/components/parameters/FarmIdFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of observed spools.
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        [farmId, connectorId, observedAt, stale, partial, spool]
                      properties:
                        farmId: { type: string, format: uuid }
                        connectorId: { type: string, format: uuid }
                        observedAt:
                          { type: integer, description: Unix milliseconds }
                        stale: { type: boolean }
                        partial: { type: boolean }
                        serviceId: { type: string, format: uuid }
                        spoolKey:
                          $ref: '#/components/schemas/SpoolmanSpoolKey'
                        spool:
                          $ref: '#/components/schemas/Spool'
                  nextCursor: { type: [string, 'null'] }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /inventory/spools/physical:
