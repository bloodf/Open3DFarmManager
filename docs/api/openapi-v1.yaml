openapi: 3.1.0
info:
  title: OpenFarm Integration API
  version: 1.1.0
  summary: Versioned API for third-party applications to observe and control a farm.
  description: |
    Contract for `/api/integrations/v1`. This file is the source of truth; the
    server publishes it unchanged (as JSON) at
    `/api/integrations/v1/openapi.json`. Versioning and deprecation rules are in
    `docs/INTEGRATION-API.md`. Farm owners register apps and manage farm- or
    printer-scoped grants in the pt-BR Integrações page; its session-authenticated
    owner routes are documented in `docs/INTEGRATION-API.md`.

    **Authentication.** Every operation except the spec and the token endpoint
    requires `Authorization: Bearer <access token>` issued by the OAuth 2.0
    client-credentials token endpoint. Session cookies are never accepted on
    these routes. Each token is bound to the app's grants: scope, farm and,
    optionally, printer. Changes to the grants covered by a token invalidate it.
    Sandbox apps are only ever granted sandbox farms.

    **Authorization.** A missing, expired, malformed or revoked token answers
    401 (`invalid-token`). A token lacking the operation's scope answers 403
    (`insufficient-scope`). A farm, printer, job, action or webhook outside the
    app's grants answers 404 (`not-found`) so that existence is not disclosed.

    **Errors.** Every error except those of the token endpoint is an RFC 9457
    `application/problem+json` document with a stable machine-readable `code`.
    Clients branch on `code`, never on `title` or `detail`.

    **Pagination.** List operations use opaque cursors: pass `cursor` from the
    previous page's `nextCursor`; `nextCursor` is `null` on the last page.
    Pages are stable under concurrent inserts.

    **Rate limits.** Each app has separate read (GET) and write (POST, DELETE)
    token buckets. Every authenticated response carries `RateLimit-Limit`,
    `RateLimit-Remaining` and `RateLimit-Reset` for the bucket the request
    consumed; a 429 or 503 also carries `Retry-After`.

    **Idempotency.** Creating a job or action requires an `Idempotency-Key`
    header. Retrying with the same key and the same body returns the original
    resource; the same key with a different body answers 409
    (`idempotency-key-reused`). Keys are kept for at least 24 hours.

    **Commands.** Jobs and actions are delivered to the printer's Connector as
    signed envelopes. The Connector alone decides whether to execute and
    refuses unsafe or unauthorized commands with a refusal code. The
    integrator is responsible for checking printer state before sending a
    command; a command whose delivery is uncertain is never retried
    automatically and ends as `outcome-unknown`.

    **Time.** All timestamps are integer milliseconds since the Unix epoch (UTC).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/integrations/v1
    description: This farm server
security:
  - clientCredentials: []
tags:
  - name: Meta
    description: The published contract.
  - name: Authentication
    description: OAuth 2.0 client-credentials tokens.
  - name: Printers
    description: Printers, their status, readiness, qualified capabilities, files and macros.
  - name: Inventory
    description: Read-only filament inventory mirrored from Spoolman.
  - name: Environment
    description: Read-only farm-authorised environment and power measurements.
  - name: Resin
    description: Read-only resin lots, vats and run references from the resin ledger.
  - name: Jobs
    description: Job history and API-submitted print jobs.
  - name: Actions
    description: Printer actions such as pause, resume and cancel.
  - name: Webhooks
    description: Signed event delivery subscriptions.
paths:
  /openapi.json:
    get:
      operationId: getOpenApiSpec
      tags: [Meta]
      summary: This specification as JSON
      description: Public; no authentication and no rate-limit headers.
      security: []
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/json:
              schema:
                type: object
        '4XX':
          description: |
            Client error outside this contract, such as a method other than
            GET or HEAD. No body is guaranteed.
  /oauth/token:
    post:
      operationId: createAccessToken
      tags: [Authentication]
      summary: Issue an access token (client credentials)
      description: |
        RFC 6749 section 4.4. The client authenticates with HTTP Basic
        (`client_secret_basic`) or with `client_id` and `client_secret` in the
        form body (`client_secret_post`), not both. Errors on this endpoint use
        the RFC 6749 error format, not problem+json. The token's lifetime is
        server configuration and is reported in `expires_in`.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Access token issued.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Malformed request, unsupported grant type or invalid scope.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: Unknown client, wrong secret or revoked credential.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            WWW-Authenticate:
              description: '`Basic realm="openfarm-integrations"`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '429':
          description: Too many token requests for this client.
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '503':
          description: Token issuance is temporarily unavailable.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
  /printers:
    get:
      operationId: listPrinters
      tags: [Printers]
      summary: List printers the app may read
      description: Only printers covered by a `printers:read` grant appear.
      security:
        - clientCredentials: ['printers:read']
      parameters:
        - $ref: '#/components/parameters/FarmIdFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of printers.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrinterPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /printers/readiness:
    get:
      operationId: listPrinterReadiness
      tags: [Printers]
      summary: Readiness of every granted printer
      description: |
        One page of pairing and eligibility for every printer covered by a
        `printers:read` grant. `paired` means OpenFarm has an assignment.
        `eligible` means the latest observation is present, not degraded, and
        the qualified operation is `supported-control` or `monitoring-only`.
        `setupPath` is an owner-facing path on this OpenFarm server, not a
        printer address and not a command channel. Out-of-grant printers are
        omitted. Machine specs are not included.
      security:
        - clientCredentials: ['printers:read']
      parameters:
        - $ref: '#/components/parameters/FarmIdFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of printer readiness summaries.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrinterReadinessPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /printers/status:
    get:
      operationId: listPrinterStatus
      tags: [Printers]
      summary: Latest status of every granted printer
      description: |
        One page of the latest observed state for every printer covered by a
        `printers:read` grant, including display name, group, location, ETA and
        the active farm alerts derived with the same rules as the farm wall
        (E20.6). Out-of-grant printers are omitted. When nothing publishable has
        been observed, `state` is `unknown` and optional readings are absent.
      security:
        - clientCredentials: ['printers:read']
      parameters:
        - $ref: '#/components/parameters/FarmIdFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of printer status snapshots.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrinterStatusPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /printers/{printerId}/capabilities:
    get:
      operationId: getPrinterCapabilities
      tags: [Printers]
      summary: Qualified operation for one printer
      description: |
        The operation Shop can rely on for this granted printer, with the
        catalog evidence revision that justified it. Classification uses
        catalog evidence grades and the latest printer state. Machine specs are
        not included; read those from `GET /printers`. `evidenceRevision` is
        null when no catalog entry matched. A printer outside the grant answers
        404.
      security:
        - clientCredentials: ['printers:read']
      parameters:
        - $ref: '#/components/parameters/PrinterId'
      responses:
        '200':
          description: Qualified operation and catalog evidence revision.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrinterCapabilities'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /printers/{printerId}/status:
    get:
      operationId: getPrinterStatus
      tags: [Printers]
      summary: Latest observed status of a printer
      description: |
        From the server's latest-state projection. When nothing has been
        observed, or the last observation cannot be published, `state` is
        `unknown` and the optional readings are absent; values are never
        guessed.
      security:
        - clientCredentials: ['printers:read']
      parameters:
        - $ref: '#/components/parameters/PrinterId'
      responses:
        '200':
          description: The printer's latest status.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrinterStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /printers/{printerId}/files:
    get:
      operationId: listPrinterFiles
      tags: [Printers]
      summary: List files stored on a printer
      description: |
        Answered live over the credential-authenticated Connector inbox. The
        Connector lists up to 200 files and may return fewer than `limit` in
        a page to fit its response budget. Follow `nextCursor` until it is
        null. Each page reads the current listing, which can change between
        requests. Printer families without file listing answer 422 `unsupported`; an unreachable Connector answers 503
        `connector-unavailable` and a Connector that does not answer in time
        answers 504 `connector-timeout`.
      security:
        - clientCredentials: ['files:read']
      parameters:
        - $ref: '#/components/parameters/PrinterId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of files.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrinterFilePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /printers/{printerId}/macros:
    get:
      operationId: listPrinterMacros
      tags: [Printers]
      summary: List macros a printer exposes
      description: |
        Answered live over the credential-authenticated Connector inbox.
        Moonraker returns up to 50 discoverable macros. Follow `nextCursor`
        until it is null. Each page reads the current listing, which can
        change between requests. Families without macro discovery answer 422
        `unsupported`. An unavailable Connector answers 503
        `connector-unavailable` and a reply deadline answers 504
        `connector-timeout`.
      security:
        - clientCredentials: ['control:extended']
      parameters:
        - $ref: '#/components/parameters/PrinterId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of macros.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MacroPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /printers/{printerId}/jobs:
    post:
      operationId: submitJob
      tags: [Jobs]
      summary: Submit a print job
      description: |
        Stores the job and either delivers it to the Connector or, when the
        grant requires operator approval, holds it (`held`). A URL job names
        an HTTPS `fileUrl`: the server never downloads or stores that file,
        and the Connector fetches it, verifies `sha256` and `sizeBytes`,
        uploads and starts. A library replay names `libraryVersionId` instead
        of a URL (optional `plate`) and needs `jobs:write` on the same grant.
        The farm's library storage mode, server or connector, is recorded on
        the job; the Connector prints the stored file and refuses an
        incompatible printer. A retry with the same `Idempotency-Key` and body
        returns the same job. A library replay also needs `jobs:write` on that grant.
      security:
        - clientCredentials: ['jobs:start']
      parameters:
        - $ref: '#/components/parameters/PrinterId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequest'
      responses:
        '202':
          description: Job accepted (new or replayed).
          headers:
            Location:
              $ref: '#/components/headers/Location'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /printers/{printerId}/actions:
    post:
      operationId: submitAction
      tags: [Actions]
      summary: Send a printer action
      description: |
        `pause`, `resume` and `cancel` require `control:basic`; every other
        action requires `control:extended`. An action the printer does not
        advertise answers 422 `unsupported` and is never delivered. Otherwise the action is delivered to the Connector or,
        when the grant requires approval, held. A retry with the same
        `Idempotency-Key` and body returns the same action.
      security:
        - clientCredentials: ['control:basic']
        - clientCredentials: ['control:extended']
      parameters:
        - $ref: '#/components/parameters/PrinterId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrinterActionRequest'
      responses:
        '202':
          description: Action accepted (new or replayed).
          headers:
            Location:
              $ref: '#/components/headers/Location'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /environment/measurements:
    get:
      operationId: listEnvironmentMeasurements
      tags: [Environment]
      summary: Environment measurements of granted printers
      description: |
        Temperature, humidity, air/extraction and power measurements per printer,
        each with a `known`, `unknown` or `unsupported` state and the last time
        the Connector observed it. Today only `air` (chamber fan speed in
        percent) is reported by the Connector; `temperature`, `humidity` and
        `power` report `unsupported` until it observes them. A reading older than
        60 seconds, from an offline printer or from a printer that never
        reported is `unknown`, never the old value. Read-only: switching,
        pairing and safety controls stay in OpenFarm. Pagination is by printer.
      security:
        - clientCredentials: ['environment:read']
      parameters:
        - $ref: '#/components/parameters/FarmIdFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of printers with their measurements.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentMeasurementsPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /health/{printerId}:
    get:
      operationId: getPrinterHealth
      summary: Read assignment and Connector health
      description: Heartbeat freshness and assignment connectivity for a granted printer. Stale heartbeats are unknown, not idle.
      security:
        - clientCredentials: ['printers:read']
      parameters:
        - in: path
          name: printerId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Connector and assignment health with degraded reasons
          content:
            application/json:
              schema:
                type: object
                required: [printerId, connector, assignment, degraded, reasons]
                properties:
                  printerId: { type: string, format: uuid }
                  connector: { type: string, enum: [connected, unknown] }
                  assignment:
                    {
                      type: string,
                      enum: [connected, reconnecting, offline, unknown],
                    }
                  degraded: { type: boolean }
                  reasons: { type: array, items: { type: string } }
                  observedAt: { type: integer, description: Unix milliseconds }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /inventory:
    get:
      operationId: listInventory
      tags: [Inventory]
      summary: Latest Spoolman inventory snapshots
      description: |
        One entry per Connector that reported a snapshot, for farms covered by
        a farm-wide `inventory:read` grant. Snapshots are read-only display evidence.
        Connectors upload a bounded display projection through authenticated
        telemetry (at most 8 spools, with no Spoolman credentials). The server
        returns the latest observation per Connector. Pagination uses a stable
        farm and Connector keyset. The Spoolman a Connector reads is set by the
        farm owner or an administrator in the pt-BR Spoolman page, or in the
        Connector's local configuration; its address and credentials are never
        part of this API, and the credentials never leave the Connector.
      security:
        - clientCredentials: ['inventory:read']
      parameters:
        - $ref: '#/components/parameters/FarmIdFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
