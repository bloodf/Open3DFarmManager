  /telemetry/{printerId}:
    get:
      operationId: getPrinterTelemetry
      summary: Read bounded observed printer history
      description: Up to seven days of observations. Offline and stale periods are gaps; missing measurements are unknown.
      security:
        - clientCredentials: ['printers:read']
      parameters:
        - in: path
          name: printerId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: since
          schema: { type: integer, minimum: 0 }
          description: Inclusive Unix milliseconds; defaults to one day before until.
        - in: query
          name: until
          schema: { type: integer, minimum: 0 }
          description: Exclusive Unix milliseconds; defaults to now.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Observed metrics and state intervals, with truncation indicated
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    since,
                    until,
                    truncated,
                    metrics,
                    intervals,
                    events,
                    eventsTruncated,
                  ]
                properties:
                  since: { type: integer }
                  until: { type: integer }
                  truncated: { type: boolean }
                  metrics:
                    type: array
                    items:
                      type: object
                      required: [observedAt]
                      properties:
                        observedAt:
                          { type: integer, description: Unix milliseconds }
                        currentLayer: { type: integer, minimum: 0 }
                        totalLayer: { type: integer, minimum: 0 }
                        progress:
                          type: object
                          required: [value, unit]
                          properties:
                            value: { type: number, minimum: 0, maximum: 1 }
                            unit: { const: ratio }
                        toolTemperature:
                          type: object
                          required: [value, unit]
                          properties:
                            value: { type: number }
                            unit: { const: '°C' }
                        bedTemperature:
                          type: object
                          required: [value, unit]
                          properties:
                            value: { type: number }
                            unit: { const: '°C' }
                        chamberFan:
                          type: object
                          required: [value, unit]
                          properties:
                            value: { type: integer, minimum: 0, maximum: 100 }
                            unit: { const: '%' }
                        elapsed:
                          type: object
                          required: [value, unit]
                          properties:
                            value: { type: number, minimum: 0 }
                            unit: { const: s }
                  eventsTruncated: { type: boolean }
                  events:
                    type: array
                    description: Observed printer state transitions, with no raw protocol details.
                    items:
                      type: object
                      required: [observedAt, from, to]
                      properties:
                        observedAt:
                          { type: integer, description: Unix milliseconds }
                        from:
                          {
                            type: string,
                            enum: [idle, printing, paused, error, offline],
                          }
                        to:
                          {
                            type: string,
                            enum: [idle, printing, paused, error, offline],
                          }
                  intervals:
                    type: array
                    items:
                      type: object
                      required: [from, until, state]
                      properties:
                        from: { type: integer }
                        until: { type: integer }
                        state:
                          {
                            type: string,
                            enum: [idle, printing, paused, error, gap],
                          }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /webhooks:
    get:
      operationId: listWebhooks
      tags: [Webhooks]
      summary: List the app's webhook subscriptions
      security:
        - clientCredentials: ['events:subscribe']
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of subscriptions.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createWebhook
      tags: [Webhooks]
      summary: Subscribe a URL to events
      description: |
        The target must be HTTPS. Loopback, link-local and private-network
        targets are refused (422 `unsafe-target`) unless the app is a sandbox
        app. Events are delivered only for farms and printers within the app's
        grants. The signing secret is returned once, in this response only.
      security:
        - clientCredentials: ['events:subscribe']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRequest'
      responses:
        '201':
          description: Subscription created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /webhooks/{webhookId}:
    delete:
      operationId: deleteWebhook
      tags: [Webhooks]
      summary: Remove a subscription
      description: Deliveries stop; events already in flight may still arrive once.
      security:
        - clientCredentials: ['events:subscribe']
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '204':
          description: Subscription removed.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /webhooks/{webhookId}/test:
    post:
      operationId: testWebhook
      tags: [Webhooks]
      summary: Queue a signed `webhook.test` delivery
      description: |
        Queues one `webhook.test` event for this subscription, signed and
        retried like any other event. No request body.
      security:
        - clientCredentials: ['events:subscribe']
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '202':
          description: Test event queued.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookTestQueued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
webhooks:
  printer.state_changed:
    post:
      operationId: onPrinterStateChanged
      summary: A printer's observed state changed
      description: Sent when `state` of a granted printer changes.
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookEventId'
        - $ref: '#/components/parameters/WebhookTimestamp'
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrinterStateChangedEvent'
      responses:
        '200':
          $ref: '#/components/responses/WebhookAccepted'
  printer.alert.raised:
    post:
      operationId: onPrinterAlertRaised
      summary: A farm alert became active on a granted printer
      description: |
        Sent when an E20.6 farm alert appears for a printer covered by the
        subscription's grants. The payload uses the same alert kinds, labels
        and messages as the farm wall. Deliveries are HMAC-signed with the
        subscription secret (`OpenFarm-Signature`).
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookEventId'
        - $ref: '#/components/parameters/WebhookTimestamp'
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrinterAlertRaisedEvent'
      responses:
        '200':
          $ref: '#/components/responses/WebhookAccepted'
  job.status_changed:
    post:
      operationId: onJobStatusChanged
      summary: An API-submitted job changed status
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookEventId'
        - $ref: '#/components/parameters/WebhookTimestamp'
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobStatusChangedEvent'
      responses:
        '200':
          $ref: '#/components/responses/WebhookAccepted'
  action.status_changed:
    post:
      operationId: onActionStatusChanged
      summary: An API-submitted action changed status
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookEventId'
        - $ref: '#/components/parameters/WebhookTimestamp'
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionStatusChangedEvent'
      responses:
        '200':
          $ref: '#/components/responses/WebhookAccepted'
  job.ended:
    post:
      operationId: onJobEnded
      summary: A job ended on a printer (any origin)
      description: Sent when a job history entry is recorded, with filament usage when known.
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookEventId'
        - $ref: '#/components/parameters/WebhookTimestamp'
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobEndedEvent'
      responses:
        '200':
          $ref: '#/components/responses/WebhookAccepted'
  inventory.changed:
    post:
      operationId: onInventoryChanged
      description: Reserved for a durable Spoolman inventory source.
      summary: A Connector reported a newer inventory snapshot that differs
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookEventId'
        - $ref: '#/components/parameters/WebhookTimestamp'
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryChangedEvent'
      responses:
        '200':
          $ref: '#/components/responses/WebhookAccepted'
  library.version.created:
    post:
      operationId: onLibraryVersionCreated
      summary: A library version was stored
      description: Sent when an integration upload creates a library version.
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookEventId'
        - $ref: '#/components/parameters/WebhookTimestamp'
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryVersionCreatedEvent'
      responses:
        '200':
          $ref: '#/components/responses/WebhookAccepted'
  webhook.test:
    post:
      operationId: onWebhookTest
      summary: Test delivery requested with `testWebhook`
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookEventId'
        - $ref: '#/components/parameters/WebhookTimestamp'
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookTestEvent'
      responses:
        '200':
          $ref: '#/components/responses/WebhookAccepted'
components:
  securitySchemes:
    clientCredentials:
      type: oauth2
      description: |
        OAuth 2.0 client credentials. Access tokens are short-lived signed
        bearer tokens bound to the app's grants.
      flows:
        clientCredentials:
          tokenUrl: /api/integrations/v1/oauth/token
          scopes:
            printers:read: Read printers, their status, readiness and qualified capabilities.
            files:read: List files stored on printers.
            inventory:read: Read Spoolman inventory snapshots and the resin ledger (lots, vats, usage).
            jobs:read: Read job history and API-submitted jobs.
            jobs:start: Submit print jobs.
            jobs:write: Start a library replay on a granted printer.
            control:basic: Pause, resume and cancel.
            control:extended: Temperatures, fans, lights, speed, homing, filament and macros; list macros.
            events:subscribe: Manage webhook subscriptions and receive events.
            library:read: Read library files and the storage mode.
            library:write: Upload library files and set the storage mode.
            environment:read: Read enclosure and room environment and power measurements.
            plates:confirm: Confirm that a printer's build plate is clear.
            alerts:write: Raise integration alerts for a farm. Reserved; no endpoint uses it yet.
            camera:view: View printer camera snapshots. Reserved; no endpoint uses it yet.
  parameters:
    PrinterId:
      name: printerId
      in: path
      required: true
      description: The printer assignment ID.
      schema:
        $ref: '#/components/schemas/Uuid'
    WebhookId:
      name: webhookId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    FarmIdFilter:
      name: farmId
      in: query
      description: Only results from this farm.
      schema:
        $ref: '#/components/schemas/Uuid'
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `nextCursor`.
      schema:
        type: string
        minLength: 1
        maxLength: 512
        pattern: '^[A-Za-z0-9_-]+$'
    Limit:
      name: limit
      in: query
      description: Maximum items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-chosen key, unique per logical request and app.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9_.:-]+$'
    WebhookEventId:
      name: OpenFarm-Event-Id
      in: header
      required: true
      description: Stable event ID; identical across retries. Use it to de-duplicate.
      schema:
        $ref: '#/components/schemas/Uuid'
    WebhookTimestamp:
      name: OpenFarm-Timestamp
      in: header
      required: true
      description: Unix time in seconds when this delivery attempt was signed.
      schema:
        type: string
        pattern: '^[0-9]{1,12}$'
    WebhookSignature:
      name: OpenFarm-Signature
      in: header
      required: true
      description: |
        `v1=<hex>` where `<hex>` is the lowercase hex HMAC-SHA256, keyed with
        the subscription's signing secret, of `<OpenFarm-Timestamp>.<raw
        request body>`. Several comma-separated `v1=` values may appear during
        secret rotation; accept the request if any matches. Compare in constant
        time and reject timestamps more than 5 minutes from your clock.
      schema:
        type: string
        pattern: '^v1=[0-9a-f]{64}(,v1=[0-9a-f]{64})*$'
  headers:
    RateLimit-Limit:
      description: Requests allowed in the current window of the consumed bucket.
      schema:
        type: integer
        minimum: 0
    RateLimit-Remaining:
      description: Requests left in the current window of the consumed bucket.
      schema:
        type: integer
        minimum: 0
    RateLimit-Reset:
      description: Seconds until the consumed bucket is full again.
      schema:
        type: integer
        minimum: 0
    Retry-After:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
    Location:
      description: URL of the created resource.
      schema:
        type: string
    CacheControlNoStore:
      description: Always `no-store`.
      schema:
        type: string
        const: no-store
  responses:
    BadRequest:
      description: Malformed request (`invalid-request`).
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, malformed, expired or revoked token (`invalid-token`).
      headers:
        WWW-Authenticate:
          description: '`Bearer realm="openfarm-integrations"`, with `error="invalid_token"` when a token was sent.'
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The token lacks the required scope (`insufficient-scope`).
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    MethodNotAllowed:
      description: |
        The path exists but not with this method (`method-not-allowed`). The
        `Allow` header lists the methods the path accepts.
      headers:
        Allow:
          description: The methods the path accepts.
          schema:
            type: string
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Unknown, or outside the app's grants (`not-found`, `intent-not-found`).
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: |
        `idempotency-key-reused`, `intent-conflict`, `request-conflict` or
        `webhook-limit-reached`.
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Request body over the limit (`payload-too-large`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Body is not `application/json` (`unsupported-media-type`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: |
        Well-formed but refused: `validation-failed`, `unsupported`,
        `unsafe-target`, `intent-expired`, `intent-too-long`.
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded (`rate-limited`).
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: |
        Storage unavailable (`service-unavailable`) or the printer's Connector
        is unreachable (`connector-unavailable`).
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    GatewayTimeout:
      description: The Connector did not answer in time (`connector-timeout`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WebhookAccepted:
      description: |
        Any 2xx acknowledges the delivery. Anything else, or no answer within
        10 seconds, is retried with exponential backoff until the retry window
        ends; the event is then dead and not delivered again.
  schemas:
    Uuid:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    TimestampMs:
      type: integer
      format: int64
      minimum: 0
      description: Milliseconds since the Unix epoch.
    ProblemCode:
      type: string
      description: |
        Stable machine-readable error code. New codes may be added within v1;
        treat an unknown code according to the HTTP status.
      enum:
        - invalid-request
        - validation-failed
        - invalid-token
        - insufficient-scope
        - not-found
        - intent-not-found
        - method-not-allowed
        - idempotency-key-reused
        - intent-conflict
        - request-conflict
        - webhook-limit-reached
        - payload-too-large
        - unsupported-media-type
        - unsupported
        - unsafe-target
        - intent-expired
        - intent-too-long
        - rate-limited
        - service-unavailable
        - connector-unavailable
        - connector-timeout
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          description: '`https://openfarm.dev/problems/<code>` or `about:blank`.'
        title:
          type: string
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 1000
        instance:
          type: string
          format: uri-reference
        code:
          $ref: '#/components/schemas/ProblemCode'
        errors:
          type: array
          maxItems: 50
          description: Per-field validation failures (`invalid-request`, `validation-failed`).
          items:
            type: object
            required: [pointer, detail]
            additionalProperties: false
            properties:
              pointer:
                type: string
                description: JSON Pointer (RFC 6901) into the request, or `/header/<name>` / `/query/<name>`.
                maxLength: 256
              detail:
                type: string
                maxLength: 200
    OAuthError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_client
            - invalid_scope
            - unauthorized_client
            - unsupported_grant_type
            - rate_limited
            - temporarily_unavailable
        error_description:
          type: string
          maxLength: 200
    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          const: client_credentials
        scope:
          type: string
          maxLength: 512
          description: Space-separated subset of the app's granted scopes; all granted scopes when omitted.
        client_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Only with `client_secret_post`.
        client_secret:
          type: string
          minLength: 1
          maxLength: 256
          description: Only with `client_secret_post`.
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scope]
      additionalProperties: false
      properties:
        access_token:
          type: string
          minLength: 1
          maxLength: 4096
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 1
          description: Lifetime in seconds.
        scope:
          type: string
          description: Space-separated scopes the token carries.
    PageInfo:
      type: object
      required: [nextCursor]
      properties:
        nextCursor:
          type: [string, 'null']
          description: Cursor for the next page; `null` on the last page.
    Printer:
      type: object
      required: [id, farmId, printerKey, controls, sandbox]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        farmId:
          $ref: '#/components/schemas/Uuid'
        printerKey:
          type: string
          minLength: 1
          maxLength: 128
          description: The printer's key within its Connector.
        displayName:
          type: string
          maxLength: 255
        vendor:
          type: string
          maxLength: 255
        model:
          type: string
          maxLength: 1024
        controls:
          type: array
          description: Actions the printer currently advertises.
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ActionName'
        sandbox:
          type: boolean
        specs:
          $ref: '#/components/schemas/PrinterSpecs'
    PrinterSpecs:
      type: object
      description: >-
        Read-only physical specs the Connector or printer profile reported.
        Omitted entirely when nothing is known; each member is omitted when
        unknown. Values are never defaulted per model.
      additionalProperties: false
      minProperties: 1
      properties:
        buildVolumeMm:
          type: object
          required: [x, y, z]
          additionalProperties: false
          properties:
            x: { type: number, exclusiveMinimum: 0 }
            y: { type: number, exclusiveMinimum: 0 }
            z: { type: number, exclusiveMinimum: 0 }
        nozzles:
          type: array
          minItems: 1
          maxItems: 8
          description: One entry per tool, in tool order.
          items:
            type: object
            required: [diameterMm]
            additionalProperties: false
            properties:
              diameterMm: { type: number, exclusiveMinimum: 0 }
        spoolSlots:
          type: integer
          minimum: 1
          description: Distinct spool slots the printer reports.
        multicolor:
          type: boolean
          description: >-
            True when more than one tool or spool slot is reported; false only
            when exactly one tool and one slot are reported.
    PrinterPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/Printer'
    PrinterStatus:
      type: object
      required: [printerId, farmId, printerKey, state]
      additionalProperties: false
      properties:
        printerId:
          $ref: '#/components/schemas/Uuid'
        farmId:
          $ref: '#/components/schemas/Uuid'
        printerKey:
          type: string
          minLength: 1
          maxLength: 128
        displayName:
          type: [string, 'null']
          maxLength: 128
        groupName:
          type: [string, 'null']
          maxLength: 128
        location:
          type: [string, 'null']
          maxLength: 128
        vendor:
          type: string
          maxLength: 255
        model:
          type: string
          maxLength: 1024
        state:
          type: string
          description: '`unknown` when nothing publishable has been observed.'
          enum: [idle, printing, paused, error, offline, unknown]
        progress:
          type: number
          minimum: 0
          maximum: 1
          description: Fraction complete; absent when unknown.
        filename:
          type: string
          maxLength: 255
        estimatedRemainingSeconds:
          type: number
          minimum: 0
        temperatures:
          type: object
          additionalProperties: false
          properties:
            toolCelsius:
              type: number
            bedCelsius:
              type: number
        activeSpools:
          type: array
          description: Active spool per tool or AMS slot, when known.
          maxItems: 17
          items:
            $ref: '#/components/schemas/ActiveSpool'
        observedAt:
          $ref: '#/components/schemas/TimestampMs'
        alerts:
          type: array
          description: Active farm alerts for this printer (E20.6 rules).
          maxItems: 16
          items:
            $ref: '#/components/schemas/PrinterAlert'
    PrinterCapabilities:
      type: object
      description: >-
        Qualified operation for one printer. Machine specs are intentionally
        absent; they belong to `Printer` and `PrinterSpecs`.
      required: [printerId, operation, catalogId, evidenceRevision]
      additionalProperties: false
      properties:
        printerId:
          $ref: '#/components/schemas/Uuid'
        operation:
          type: string
          enum:
            - supported-control
            - monitoring-only
            - unknown-firmware
            - temporarily-unavailable
            - unqualified
        catalogId:
          type: [string, 'null']
          description: Compatibility catalog entry, or null when nothing matched.
          pattern: '^[a-z0-9-]{1,80}$'
        evidenceRevision:
          type: [string, 'null']
          description: >-
            SHA-256 of the catalog evidence used for this classification.
            Null when no catalog entry matched. Does not cover machine specs.
          pattern: '^[a-f0-9]{64}$'
    PrinterReadiness:
      type: object
      required:
        - printerId
        - farmId
        - printerKey
        - paired
        - eligible
        - observedAt
        - degradedReason
        - setupPath
      additionalProperties: false
      properties:
        printerId:
          $ref: '#/components/schemas/Uuid'
        farmId:
          $ref: '#/components/schemas/Uuid'
        printerKey:
          type: string
          minLength: 1
          maxLength: 128
        paired:
          type: boolean
          description: True when OpenFarm has an assignment for this printer.
        eligible:
          type: boolean
          description: >-
            True when the printer is paired, a non-degraded observation exists,
            and the qualified operation is supported-control or monitoring-only.
        observedAt:
          type: [integer, 'null']
          minimum: 0
          description: Last observation, in milliseconds since the Unix epoch.
        degradedReason:
          type: [string, 'null']
          enum:
            - offline
            - reconnecting
            - error
            - client-certificate-missing
            - null
        setupPath:
          type: string
          minLength: 1
          maxLength: 512
          pattern: "^/impressoras/[^?]+\\?farm=[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: >-
            Owner-facing path on this OpenFarm server. Not a printer address.
    PrinterReadinessPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/PrinterReadiness'
    BulkPrinterStatus:
      allOf:
        - $ref: '#/components/schemas/PrinterStatus'
        - type: object
          required: [alerts]
    PrinterStatusPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/BulkPrinterStatus'
    PrinterAlert:
      type: object
      required: [id, kind, label, message]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 256
        kind:
          type: string
          enum:
            - error
            - connector-storage-degraded
            - offline-or-stale
            - paused
            - finished-bed-clear
            - low-slot
            - firmware-update
        label:
          type: string
          minLength: 1
          maxLength: 128
        message:
          type: string
          minLength: 1
          maxLength: 1024
    ActiveSpool:
      type: object
      description: Spool assigned to one printer tool or AMS slot.
      required: [slot]
      additionalProperties: false
      properties:
        slot:
          type: string
          minLength: 1
          maxLength: 32
          description: Tool or AMS tray identifier (for example `external` or `ams:0:1`).
        name:
          type: string
          maxLength: 32
        material:
          type: string
          maxLength: 64
        colorHex:
          type: string
          pattern: '^[0-9a-f]{6}$'
        remainingGrams:
          type: integer
        remainingPercent:
          type: number
          minimum: 0
          maximum: 100
        spoolId:
          type: integer
          minimum: 1
          description: Spoolman spool id when known.
    PrinterFile:
      type: object
      required: [name, sizeBytes, modifiedAt]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Relative path on the printer.
        sizeBytes:
          type: integer
          minimum: 0
        modifiedAt:
          $ref: '#/components/schemas/TimestampMs'
        estimatedSeconds:
          type: number
          minimum: 0
    PrinterFilePage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/PrinterFile'
    Macro:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/MacroName'
    MacroName:
      type: string
      pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$'
    MacroPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/Macro'
    Spool:
      type: object
      required: [name, material, colorHex, remainingGrams, location, archived]
      additionalProperties: false
      properties:
        name:
          type: [string, 'null']
          maxLength: 32
        material:
          type: [string, 'null']
          maxLength: 16
        colorHex:
          type: [string, 'null']
          pattern: '^[0-9a-f]{6}$'
        remainingGrams:
          type: [integer, 'null']
          description: Negative values are reported as stored, never clamped.
        location:
          type: [string, 'null']
          maxLength: 32
        archived:
          type: boolean
    InventorySnapshot:
      type: object
      required: [farmId, connectorId, observedAt, stale, total, spools]
      additionalProperties: false
      properties:
        farmId:
          $ref: '#/components/schemas/Uuid'
        connectorId:
          $ref: '#/components/schemas/Uuid'
        observedAt:
          $ref: '#/components/schemas/TimestampMs'
        stale:
          type: boolean
        total:
          type: integer
          minimum: 0
          maximum: 10000
          description: Spools known to Spoolman; `spools` may be a bounded subset.
        spools:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/Spool'
    InventoryPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/InventorySnapshot'
    ResinSource:
      type: string
      enum: [manual, measured]
      description: '`manual` was recorded by an operator, `measured` was reported by the Connector.'
    ResinQuantity:
      type: object
      required: [quantity, unit, quantityState, source, observedAt]
      properties:
        quantity:
          type: [number, 'null']
          minimum: 0
          description: Amount in `unit`; `null` while unknown, never zero.
        unit:
          type: string
          const: ml
        quantityState:
          type: string
          enum: [known, unknown]
        source:
          $ref: '#/components/schemas/ResinSource'
        observedAt:
          $ref: '#/components/schemas/TimestampMs'
    ResinPrinterRef:
      type: object
      required: [printerId, farmId, printerKey]
      properties:
        printerId:
          $ref: '#/components/schemas/Uuid'
        farmId:
          $ref: '#/components/schemas/Uuid'
        printerKey:
          type: string
    ResinLot:
      allOf:
        - $ref: '#/components/schemas/ResinQuantity'
        - type: object
          required: [lotRef]
          properties:
            lotRef:
              type: string
              description: The label given to the bottle.
    ResinVat:
      allOf:
        - $ref: '#/components/schemas/ResinQuantity'
        - type: object
          required: [vatRef, current]
          properties:
            vatRef:
              type: string
            current:
              type: boolean
    ResinReading:
      type: object
      required: [target, ref, quantity, unit, source, observedAt]
      properties:
        target:
          type: string
          enum: [vat, bottle]
        ref:
          type: string
        quantity:
          type: number
          minimum: 0
        unit:
          type: string
          const: ml
        source:
          $ref: '#/components/schemas/ResinSource'
        observedAt:
          $ref: '#/components/schemas/TimestampMs'
    ResinRunConsumption:
      type: object
      required: [runRef, outcome, endedAt, consumption]
      properties:
        runRef:
          type: string
        outcome:
          type: string
          enum: [completed, cancelled, failed]
        endedAt:
          $ref: '#/components/schemas/TimestampMs'
        consumption:
          type: object
          required: [state]
          properties:
            state:
              type: string
              const: unknown
    ResinLotsPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              maxItems: 100
              items:
                allOf:
                  - $ref: '#/components/schemas/ResinPrinterRef'
                  - type: object
                    required: [lots]
                    properties:
                      lots:
                        type: array
                        items:
                          $ref: '#/components/schemas/ResinLot'
    ResinVatsPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              maxItems: 100
              items:
                allOf:
                  - $ref: '#/components/schemas/ResinPrinterRef'
                  - type: object
                    required: [vats]
                    properties:
                      vats:
                        type: array
                        items:
                          $ref: '#/components/schemas/ResinVat'
    ResinUsagePage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              maxItems: 100
              items:
                allOf:
                  - $ref: '#/components/schemas/ResinPrinterRef'
                  - type: object
                    required: [readings, runs]
                    properties:
                      readings:
                        type: array
                        maxItems: 50
                        items:
                          $ref: '#/components/schemas/ResinReading'
                      runs:
                        type: array
                        maxItems: 20
                        items:
                          $ref: '#/components/schemas/ResinRunConsumption'
    EnvironmentMeasurement:
      type: object
      required: [kind, state]
      properties:
        kind:
          type: string
          enum: [temperature, humidity, air, power]
        state:
          type: string
          enum: [known, unknown, unsupported]
        value:
          description: Present only when `state` is `known`. `air` is the chamber fan speed in percent.
          oneOf:
            - type: number
            - type: boolean
        unit:
          type: string
          enum: [percent, celsius, boolean]
        lastObservedAt:
          $ref: '#/components/schemas/TimestampMs'
        reason:
          type: string
          enum: [never-observed, offline, stale]
          description: Present when `state` is `unknown`.
    EnvironmentPrinter:
      type: object
      required: [printerId, farmId, printerKey, measurements]
      properties:
        printerId:
          $ref: '#/components/schemas/Uuid'
        farmId:
          $ref: '#/components/schemas/Uuid'
        printerKey:
          type: string
        displayName:
          type: string
        location:
          type: string
        measurements:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentMeasurement'
    EnvironmentMeasurementsPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/EnvironmentPrinter'
    FilamentUsage:
      type: object
      additionalProperties: false
      required: [tool]
      properties:
        tool:
          type: string
          minLength: 1
          maxLength: 32
        grams:
          type: number
          minimum: 0
        millimetres:
          type: number
          minimum: 0
        spoolName:
          type: string
          maxLength: 32
        material:
          type: string
          maxLength: 64
    JobHistoryEntry:
      type: object
      required: [id, farmId, printerId, outcome, endedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
          description: Job history entry ID.
        farmId:
          $ref: '#/components/schemas/Uuid'
        printerId:
          $ref: '#/components/schemas/Uuid'
        jobId:
          $ref: '#/components/schemas/Uuid'
          description: Present when the job was submitted through this API.
        outcome:
          type: string
          enum: [completed, cancelled, failed]
        filename:
          type: string
          maxLength: 255
        printDurationSeconds:
          type: number
          minimum: 0
        totalDurationSeconds:
          type: number
          minimum: 0
        filamentUsage:
          type: array
          description: Per-tool usage recorded at job end, when known.
          maxItems: 17
          items:
            $ref: '#/components/schemas/FilamentUsage'
        endedAt:
          $ref: '#/components/schemas/TimestampMs'
    JobHistoryPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/JobHistoryEntry'
    StorageMode:
      type: string
      enum: [server, connector]
      description: |
        `server` keeps the file on the farm server. `connector` keeps it on
        the Connector and the server stores the hash and metadata only.
    LibraryVersion:
      type: object
      additionalProperties: false
      required:
        [
          id,
          itemId,
          versionNumber,
          sha256,
          sizeBytes,
          storageLocation,
          originalName,
          kind,
          plateCount,
          createdAt,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        itemId:
          $ref: '#/components/schemas/Uuid'
        versionNumber:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        sizeBytes:
          type: integer
          minimum: 1
        storageLocation:
          $ref: '#/components/schemas/StorageMode'
        originalName:
          type: string
          minLength: 1
          maxLength: 255
        kind:
          type: string
          enum: [gcode, 3mf]
        plateCount:
          type: integer
          minimum: 0
          maximum: 1000
        createdAt:
          $ref: '#/components/schemas/TimestampMs'
    LibraryItem:
      type: object
      additionalProperties: false
      required: [id, farmId, title, storageMode, latest]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        farmId:
          $ref: '#/components/schemas/Uuid'
        title:
          type: string
          minLength: 1
          maxLength: 200
        storageMode:
          $ref: '#/components/schemas/StorageMode'
        latest:
          $ref: '#/components/schemas/LibraryVersion'
    LibraryPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [data, storageMode]
          properties:
            data:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/LibraryItem'
            storageMode:
              $ref: '#/components/schemas/StorageMode'
    LibrarySettings:
      type: object
      additionalProperties: false
      required: [farmId, storageMode]
      properties:
        farmId:
          $ref: '#/components/schemas/Uuid'
        storageMode:
          $ref: '#/components/schemas/StorageMode'
    LibrarySettingsPatch:
      type: object
      additionalProperties: false
      required: [farmId, storageMode]
      properties:
        farmId:
          $ref: '#/components/schemas/Uuid'
        storageMode:
          $ref: '#/components/schemas/StorageMode'
    LibraryUpload:
      type: object
      additionalProperties: false
      required: [farmId, name, contentBase64]
      properties:
        farmId:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          minLength: 1
          maxLength: 255
        contentBase64:
          type: string
          minLength: 4
          maxLength: 70000000
    LibraryUploadResult:
      type: object
      additionalProperties: false
      required: [item, version, storageMode, deduplicated]
      properties:
        item:
          type: object
          additionalProperties: false
          required: [id, farmId, title, storageMode]
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            farmId:
              $ref: '#/components/schemas/Uuid'
            title:
              type: string
              minLength: 1
              maxLength: 200
            storageMode:
              $ref: '#/components/schemas/StorageMode'
        version:
          $ref: '#/components/schemas/LibraryVersion'
        storageMode:
          $ref: '#/components/schemas/StorageMode'
        deduplicated:
          type: boolean
    JobRequest:
      description: |
        Either an HTTPS file reference or a library replay (`libraryVersionId`,
        optional `plate`). `library_version_id` is accepted as an alias.
      properties:
        fileUrl:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https://'
          description: HTTPS URL the Connector downloads; redirects to non-HTTPS are refused.
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Lowercase hex SHA-256 of the file.
        sizeBytes:
          type: integer
          minimum: 1
          description: Exact file size; the server enforces a configured maximum.
        displayName:
          type: string
          minLength: 1
          maxLength: 255
      oneOf:
        - type: object
          required: [fileUrl, sha256, sizeBytes, displayName]
          additionalProperties: false
          properties:
            fileUrl:
              type: string
              format: uri
              maxLength: 2048
              pattern: '^https://'
              description: HTTPS URL the Connector downloads; redirects to non-HTTPS are refused.
            sha256:
              type: string
              pattern: '^[0-9a-f]{64}$'
              description: Lowercase hex SHA-256 of the file.
            sizeBytes:
              type: integer
              minimum: 1
              description: Exact file size; the server enforces a configured maximum.
            displayName:
              type: string
              minLength: 1
              maxLength: 255
        - type: object
          required: [libraryVersionId]
          additionalProperties: false
          description: Replay a library version. `library_version_id` is accepted as an alias of `libraryVersionId`.
          properties:
            libraryVersionId:
              $ref: '#/components/schemas/Uuid'
            plate:
              type: integer
              minimum: 1
              maximum: 1000
              description: Plate of a 3MF project. Omitted for G-code and for the first plate.
    RefusalCode:
      type: string
      description: |
        Why the Connector refused a command. New codes may be added within v1;
        treat an unknown code as a refusal.
      enum:
        - printer-busy
        - not-ready
        - wrong-state
        - checksum-mismatch
        - grant-revoked
        - expired
        - unsupported
    CommandRefusal:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/RefusalCode'
        detail:
          type: string
          maxLength: 500
    Job:
      type: object
      required:
        [
          id,
          farmId,
          printerId,
          status,
          displayName,
          fileUrl,
          sha256,
          sizeBytes,
          createdAt,
          updatedAt,
        ]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        farmId:
          $ref: '#/components/schemas/Uuid'
        printerId:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          description: |
            `held` awaits operator approval; `rejected` was refused by an
            operator or its approved envelope could not be issued; `queued` was accepted and waits for the Connector to
            confirm delivery; `expired` was never delivered before its expiry;
            `delivered` reached the Connector; `refused` was refused by the
            Connector (see `refusal`); `started`, `completed`, `cancelled` and
            `failed` follow the print; `outcome-unknown` means delivery or
            execution could not be confirmed and nothing was retried. Final
            states never change.
          enum:
            - held
            - rejected
            - queued
            - expired
            - delivered
            - refused
            - started
            - completed
            - cancelled
            - failed
            - outcome-unknown
        refusal:
          $ref: '#/components/schemas/CommandRefusal'
        displayName:
          type: string
          maxLength: 255
        fileUrl:
          type: string
          maxLength: 2048
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        sizeBytes:
          type: integer
          minimum: 1
        libraryVersionId:
          $ref: '#/components/schemas/Uuid'
          description: Set when the job replays a library version.
        plate:
          type: integer
          minimum: 1
          maximum: 1000
        storageMode:
          $ref: '#/components/schemas/StorageMode'
          description: Where the replayed file is stored.
        historyEntryId:
          type: string
          pattern: '^[0-9]{1,19}$'
          description: The job history entry once the print has ended.
        createdAt:
          $ref: '#/components/schemas/TimestampMs'
        updatedAt:
          $ref: '#/components/schemas/TimestampMs'
    ActionName:
      type: string
      enum:
        - pause
        - resume
        - cancel
        - set_temperature
        - set_fan
        - home
        - set_light
        - set_speed
        - run_macro
        - load_filament
        - unload_filament
        - confirm_collection
    JobActionRequest:
      allOf:
        - $ref: '#/components/schemas/ActionRequest'
      oneOf:
        - type: object
          required: [action, args]
          additionalProperties: false
          properties:
            action:
              enum: [pause, resume, cancel]
            args:
              type: object
              additionalProperties: false
        - $ref: '#/components/schemas/PlateConfirmationRequest'
    PlateConfirmationRequest:
      type: object
      required: [action, args]
      additionalProperties: false
      properties:
        action:
          const: confirm_collection
        args:
          type: object
          required: [attempt]
          additionalProperties: false
          properties:
            attempt:
              type: string
              pattern: '^(?:0|[1-9][0-9]{0,15})$'
    ActionRequest:
      description: Accepted action names and arguments across the printer and job action routes.
      oneOf:
        - $ref: '#/components/schemas/PrinterActionRequest'
        - $ref: '#/components/schemas/PlateConfirmationRequest'
    PrinterActionRequest:
      description: One action and its arguments; `args` is required and `{}` for actions without arguments.
      oneOf:
        - type: object
          required: [action, args]
          additionalProperties: false
          properties:
            action:
              type: string
              enum: [pause, resume, cancel, unload_filament]
            args:
              type: object
              additionalProperties: false
        - type: object
          required: [action, args]
          additionalProperties: false
          properties:
            action:
              type: string
              const: set_temperature
            args:
              type: object
              required: [heater, targetCelsius]
              additionalProperties: false
              properties:
                heater:
                  type: string
                  enum: [extruder, bed, chamber]
                targetCelsius:
                  type: integer
                  minimum: 0
        - type: object
          required: [action, args]
          additionalProperties: false
          properties:
            action:
              type: string
              const: set_fan
            args:
              type: object
              required: [fan, percent]
              additionalProperties: false
              properties:
                fan:
                  type: string
                  enum: [part, aux, chamber]
                percent:
                  type: integer
                  minimum: 0
                  maximum: 100
        - type: object
          required: [action, args]
          additionalProperties: false
          properties:
            action:
              type: string
              const: home
            args:
              type: object
              required: [axes]
              additionalProperties: false
              properties:
                axes:
                  type: array
                  minItems: 1
                  maxItems: 3
                  uniqueItems: true
                  items:
                    type: string
                    enum: [x, y, z]
        - type: object
          required: [action, args]
          additionalProperties: false
          properties:
            action:
              type: string
              const: set_light
            args:
              type: object
              required: ['on']
              additionalProperties: false
              properties:
                'on':
                  type: boolean
        - type: object
          required: [action, args]
          additionalProperties: false
          properties:
            action:
              type: string
              const: set_speed
            args:
              type: object
              required: [level]
              additionalProperties: false
              properties:
                level:
                  type: string
                  enum: [silent, standard, sport, ludicrous]
        - type: object
          required: [action, args]
          additionalProperties: false
          properties:
            action:
              type: string
              const: run_macro
            args:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name:
                  $ref: '#/components/schemas/MacroName'
        - type: object
          required: [action, args]
          additionalProperties: false
          properties:
            action:
              type: string
              const: load_filament
            args:
              type: object
              additionalProperties: false
              properties:
                tray:
                  type: integer
                  minimum: 0
                  maximum: 15
    Action:
      type: object
      required:
        [id, farmId, printerId, action, args, status, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        farmId:
          $ref: '#/components/schemas/Uuid'
        printerId:
          $ref: '#/components/schemas/Uuid'
        action:
          $ref: '#/components/schemas/ActionName'
        args:
          type: object
          description: The arguments as submitted.
        status:
          type: string
          description: |
            `held`, `rejected`, `expired`, `delivered` and `refused` as for
            jobs; `completed` and `failed` report the Connector's result;
            `outcome-unknown` means the result could not be confirmed and
            nothing was retried. Final states never change.
          enum:
            - held
            - rejected
            - queued
            - expired
            - delivered
            - refused
            - completed
            - failed
            - outcome-unknown
        refusal:
          $ref: '#/components/schemas/CommandRefusal'
        createdAt:
          $ref: '#/components/schemas/TimestampMs'
        updatedAt:
          $ref: '#/components/schemas/TimestampMs'
    EventType:
      type: string
      enum:
        - printer.state_changed
        - printer.alert.raised
        - job.status_changed
        - action.status_changed
        - job.ended
        - inventory.changed
        - library.version.created
        - webhook.test
    WebhookRequest:
      type: object
      required: [url, events]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https://'
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EventType'
        description:
          type: string
          maxLength: 255
    Webhook:
      type: object
      required: [id, url, events, createdAt]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        url:
          type: string
          maxLength: 2048
        events:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EventType'
        description:
          type: string
          maxLength: 255
        createdAt:
          $ref: '#/components/schemas/TimestampMs'
    WebhookCreated:
      type: object
      required: [id, url, events, createdAt, signingSecret]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Webhook/properties/id'
        url:
          $ref: '#/components/schemas/Webhook/properties/url'
        events:
          $ref: '#/components/schemas/Webhook/properties/events'
        description:
          $ref: '#/components/schemas/Webhook/properties/description'
        createdAt:
          $ref: '#/components/schemas/Webhook/properties/createdAt'
        signingSecret:
          type: string
          minLength: 32
          maxLength: 256
          description: Shown only in this response; it cannot be retrieved again.
    WebhookPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/Webhook'
    WebhookTestQueued:
      type: object
      required: [eventId]
      additionalProperties: false
      properties:
        eventId:
          $ref: '#/components/schemas/Uuid'
    EventEnvelope:
      type: object
      required: [id, type, occurredAt, data]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/EventType'
        occurredAt:
          $ref: '#/components/schemas/TimestampMs'
        data:
          type: object
    PrinterStateChangedEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            type:
              const: printer.state_changed
            data:
              $ref: '#/components/schemas/PrinterStatus'
    PrinterAlertRaisedEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            type:
              const: printer.alert.raised
            data:
              type: object
              additionalProperties: false
              required: [farmId, printerId, printerKey, alert]
              properties:
                farmId:
                  $ref: '#/components/schemas/Uuid'
                printerId:
                  $ref: '#/components/schemas/Uuid'
                printerKey:
                  type: string
                  minLength: 1
                  maxLength: 128
                displayName:
                  type: [string, 'null']
                  maxLength: 128
                groupName:
                  type: [string, 'null']
                  maxLength: 128
                location:
                  type: [string, 'null']
                  maxLength: 128
                alert:
                  $ref: '#/components/schemas/PrinterAlert'
    JobStatusChangedEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            type:
              const: job.status_changed
            data:
              $ref: '#/components/schemas/Job'
    ActionStatusChangedEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            type:
              const: action.status_changed
            data:
              $ref: '#/components/schemas/Action'
    JobEndedEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            type:
              const: job.ended
            data:
              $ref: '#/components/schemas/JobHistoryEntry'
    InventoryChangedEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            type:
              const: inventory.changed
            data:
              $ref: '#/components/schemas/InventorySnapshot'
    LibraryVersionCreatedEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            type:
              const: library.version.created
            data:
              type: object
              additionalProperties: false
              required: [farmId, itemId, versionId, storageMode, sha256]
              properties:
                farmId:
                  $ref: '#/components/schemas/Uuid'
                itemId:
                  $ref: '#/components/schemas/Uuid'
                versionId:
                  $ref: '#/components/schemas/Uuid'
                storageMode:
                  $ref: '#/components/schemas/StorageMode'
                sha256:
                  type: string
                  pattern: '^[0-9a-f]{64}$'
    WebhookTestEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            type:
              const: webhook.test
            data:
              type: object
              required: [webhookId]
              additionalProperties: false
              properties:
                webhookId:
                  $ref: '#/components/schemas/Uuid'
