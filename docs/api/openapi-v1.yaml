      summary: List spool ledger records for a finished run
      description: |
        Requires a farm-wide inventory grant and the spool usage runtime.
        Upsert records by farm and usage ID. Corrections replace grams under
        the same usage ID. Rows without an explicit Spoolman binding omit
        serviceId, serviceSpoolId and spoolKey. Join to service observations
        only by spoolKey when present, using farmId to preserve farm scope.
