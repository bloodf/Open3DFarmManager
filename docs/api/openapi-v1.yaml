      operationId: registerPhysicalSpool
      tags: [Inventory]
      summary: Register a physical spool
      description: |
        Creates a spool using an existing filament in the farm-wide grant. A
        caller with a farm-wide inventory write grant may attest an explicit
        Spoolman binding at creation. The binding is immutable. A second local
        spool cannot claim the same external identity in the same farm.
        A retry with the same key, farm and body returns the original response.
        Reusing the key with different input returns 409 (`idempotency-key-reused`).
        A duplicate binding returns 409 (`spool-already-bound`).
      security:
        - clientCredentials: ['inventory:write']
      parameters:
        - $ref: '#/components/parameters/PhysicalSpoolFarmId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhysicalSpoolRegistration'
      responses:
        '201':
          description: Physical spool and its label link.
          headers:
            Location:
              description: API resource URI. Reading it requires inventory:read.
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalSpool'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
