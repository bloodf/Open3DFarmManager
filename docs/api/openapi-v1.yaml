  /notification-channels/{farmId}/test:
    post:
      operationId: testFarmNotificationChannel
      summary: Test the app’s configured farm notification webhook
      description: Requires a farm-wide grant issued by a current farm owner and usable without interactive approval. Sends at most one signed POST to a public HTTPS destination.
      security:
        - clientCredentials: ['alerts:manage']
      parameters:
        - in: path
          name: farmId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Delivery outcome. A 2xx from the receiver means delivered.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [attempted, status]
                    properties:
                      attempted: { type: boolean, const: true }
                      status: { type: string, enum: [delivered, failed] }
                  - type: object
                    required: [attempted, status]
                    properties:
                      attempted: { type: boolean, const: false }
                      status: { type: string, const: not-run }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
