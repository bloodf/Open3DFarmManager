                  assessedAt: { type: integer, description: Unix milliseconds }
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        [
                          farmId,
                          spoolId,
                          name,
                          material,
                          colorHex,
                          location,
                          remainingGrams,
                          colorDistance,
                          loaded,
                          loadedAt,
                        ]
                      properties:
                        farmId: { type: string, format: uuid }
                        spoolId:
                          type: integer
                          minimum: 1
