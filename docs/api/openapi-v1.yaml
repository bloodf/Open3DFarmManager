                        serviceId:
                          type: string
                          format: uuid
                          description: Explicitly bound Spoolman service.
                        serviceSpoolId:
                          type: integer
                          minimum: 1
                          maximum: 9007199254740991
                          description: Numeric spool ID in the bound Spoolman service.
                        spoolKey:
                          $ref: '#/components/schemas/SpoolmanSpoolKey'
                        name: { type: [string, 'null'] }
                        material: { type: [string, 'null'] }
                        colorHex: { type: [string, 'null'] }
                        location: { type: [string, 'null'] }
                        remainingGrams: { type: [number, 'null'] }
                        colorDistance: { type: [number, 'null'] }
                        loaded: { type: boolean }
                        loadedAt:
                          type: array
                          items:
                            type: object
                            required:
                              [printerId, slotKind, slotIndex, assignedAt]
                            properties:
                              printerId: { type: string, format: uuid }
                              slotKind:
                                { type: string, enum: [printer, ams, toolhead] }
                              slotIndex: { type: integer, minimum: 0 }
                              assignedAt:
                                {
                                  type: integer,
                                  description: Unix milliseconds,
