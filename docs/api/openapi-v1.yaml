      responses:
        '200':
          description: Connector observation for the job's assigned printer.
          content:
            application/json:
              schema:
                type: object
                required: [jobId, printerId, plate, eligible, reasons]
                properties:
                  jobId:
                    $ref: '#/components/schemas/Uuid'
                  printerId:
                    $ref: '#/components/schemas/Uuid'
                  plate:
                    type: object
                    required: [state, observedAt]
                    properties:
                      state:
                        type: string
                        enum: [awaiting-collection, operator-confirmed, unknown]
                      observedAt:
                        type: integer
                        description: Connector observation time in Unix milliseconds.
                      attemptId:
                        type: string
                  eligible:
                    type: boolean
                    description: Advisory result. The Connector rechecks at execution.
                  reasons:
                    type: array
                    items:
                      type: string
                      enum:
                        [
                          job-not-pending,
                          printer-busy,
                          printer-not-ready,
                          awaiting-collection,
                          plate-state-uncertain,
                        ]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '422':
