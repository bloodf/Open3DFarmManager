  /resin/lots:
    get:
      operationId: listResinLots
      tags: [Resin]
      summary: Resin bottles (lots) of granted printers
      description: |
        Read-only ledger of the printers covered by the grant: a farm-wide
        `inventory:read` grant covers every printer of the farm, a printer grant
        only its printer. Only printers with ledger entries are listed;
        pagination is by printer. `source` is `manual` for operator records and
        `measured` for what the Connector reported. Unknown stays unknown: a
        quantity that was never recorded is `null` with `quantityState` `unknown`,
        never zero. The ledger has no lot register, so a lot is the label given
        to the bottle.
      security:
        - clientCredentials: ['inventory:read']
      parameters:
        - $ref: '#/components/parameters/FarmIdFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of printers with their resin lots.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResinLotsPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /resin/usage:
    get:
      operationId: listResinUsage
      tags: [Resin]
      summary: Resin readings and run references of granted printers
      description: |
        Observed resin amounts (newest first, at most 50 per printer) and the
        last finished runs (at most 20 per printer). The ledger never links a
        reading to a run, so every run reports `consumption.state` `unknown`:
        consumption is not estimated, and is never derived from a filament
        slot. Compare measured readings yourself, noting their `observedAt`.
        Same grant scope, `source` and pagination rules as `/resin/lots`.
      security:
        - clientCredentials: ['inventory:read']
      parameters:
        - $ref: '#/components/parameters/FarmIdFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of printers with their readings and runs.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResinUsagePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /resin/vats:
    get:
      operationId: listResinVats
      tags: [Resin]
      summary: Resin vats of granted printers
      description: |
        Read-only ledger of the printers covered by the grant: a farm-wide
        `inventory:read` grant covers every printer of the farm, a printer grant
        only its printer. Only printers with ledger entries are listed;
        pagination is by printer. `source` is `manual` for operator records and
        `measured` for what the Connector reported. Unknown stays unknown: a
        quantity that was never recorded is `null` with `quantityState` `unknown`,
