      tags: [Library]
      summary: List library items
      description: |
        Newest library item per page for one farm covered by a farm-wide
        `library:read` grant. `storageMode` is the farm's current mode
        (`server` keeps the file, `connector` keeps it on the Connector).
        A version's `storageLocation` is where that file actually is.
        Returns supported resin extensions and compatible printer profiles.
      security:
        - clientCredentials: ['library:read']
      parameters:
        - $ref: '#/components/parameters/RequiredFarmId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of library items.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: uploadLibrary
      tags: [Library]
      summary: Upload a library file
      description: |
        Stores the file according to the farm's current storage mode. Server
        mode keeps the bytes. Connector mode keeps the hash and metadata and
        leaves the bytes on the farm's Connector. Requires a farm-wide
        `library:write` grant. Resin files require a compatible `resinProfile`.
        Use `GET /library` to discover extension/profile pairs. A mismatched
        declaration returns 422 with a reason in `errors`.
        A new version emits `library.version.created`.
      security:
        - clientCredentials: ['library:write']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryUpload'
      responses:
        '201':
          description: File stored.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryUploadResult'
        '400':
