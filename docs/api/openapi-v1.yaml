      responses:
        '200':
          description: Page of spool ledger entries.
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        [
                          usageId,
                          farmId,
                          jobId,
                          spoolId,
                          printerId,
                          grams,
                          source,
                          observedAt,
                          corrected,
                        ]
                      properties:
