  /jobs:
    get:
      operationId: listJobHistory
      tags: [Jobs]
      summary: List ended jobs (job history)
      description: |
        Ended jobs from the farm's job history, newest first, for printers
        covered by a `jobs:read` grant. `since` and `until` filter on `endedAt`
        (inclusive, exclusive). Finished jobs the Connector did not watch end
        are imported from Moonraker's own print history on connect and after
        reconnects (bounded pages, at most 200 recent jobs). An import never
        repeats a job already recorded for the printer and end time.
      security:
        - clientCredentials: ['jobs:read']
      parameters:
        - $ref: '#/components/parameters/FarmIdFilter'
        - name: printerId
          in: query
          description: Only entries of this printer.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: since
          in: query
          description: Only entries with `endedAt` at or after this time.
          schema:
            $ref: '#/components/schemas/TimestampMs'
        - name: until
          in: query
          description: Only entries with `endedAt` before this time.
          schema:
            $ref: '#/components/schemas/TimestampMs'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of job history entries.
