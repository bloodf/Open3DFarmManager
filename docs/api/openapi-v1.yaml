            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResinVatsPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /telemetry/{printerId}:
    get:
      operationId: getPrinterTelemetry
      summary: Read bounded observed printer history
      description: Up to seven days of observations. Offline and stale periods are gaps; missing measurements are unknown.
      security:
        - clientCredentials: ['printers:read']
      parameters:
        - in: path
          name: printerId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: since
          schema: { type: integer, minimum: 0 }
          description: Inclusive Unix milliseconds; defaults to one day before until.
        - in: query
          name: until
          schema: { type: integer, minimum: 0 }
          description: Exclusive Unix milliseconds; defaults to now.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Observed metrics and state intervals, with truncation indicated
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    since,
                    until,
                    truncated,
                    metrics,
                    intervals,
                    events,
                    eventsTruncated,
                  ]
                properties:
                  since: { type: integer }
                  until: { type: integer }
                  truncated: { type: boolean }
                  metrics:
                    type: array
                    items:
                      type: object
                      required: [observedAt]
                      properties:
                        observedAt:
                          { type: integer, description: Unix milliseconds }
                        currentLayer: { type: integer, minimum: 0 }
                        totalLayer: { type: integer, minimum: 0 }
                        progress:
                          type: object
                          required: [value, unit]
                          properties:
                            value: { type: number, minimum: 0, maximum: 1 }
                            unit: { const: ratio }
                        toolTemperature:
                          type: object
                          required: [value, unit]
                          properties:
                            value: { type: number }
                            unit: { const: '°C' }
                        bedTemperature:
                          type: object
                          required: [value, unit]
                          properties:
                            value: { type: number }
                            unit: { const: '°C' }
                        toolTargets:
                          type: array
                          maxItems: 32
                          items:
                            type: object
                            required: [tool, value, unit]
                            properties:
                              tool: { type: integer, minimum: 0, maximum: 999 }
                              value: { type: number }
                              unit: { const: '°C' }
                        chamberTemperature:
                          type: object
                          required: [value, unit]
                          properties:
                            value: { type: number }
                            unit: { const: '°C' }
                        chamberTarget:
                          type: object
                          required: [value, unit]
                          properties:
                            value: { type: number }
                            unit: { const: '°C' }
                        runEnergy:
                          type: object
                          required: [value, unit]
                          properties:
                            value: { type: number, minimum: 0 }
                            unit: { const: Wh }
                        chamberFan:
                          type: object
                          required: [value, unit]
                          properties:
                            value: { type: integer, minimum: 0, maximum: 100 }
                            unit: { const: '%' }
                        elapsed:
                          type: object
                          required: [value, unit]
                          properties:
                            value: { type: number, minimum: 0 }
                            unit: { const: s }
                  eventsTruncated: { type: boolean }
                  events:
                    type: array
                    description: Observed printer state transitions, with no raw protocol details.
                    items:
                      type: object
                      required: [observedAt, from, to]
                      properties:
                        reason:
                          { type: string, enum: [client-certificate-missing] }
                        observedAt:
                          { type: integer, description: Unix milliseconds }
                        from:
                          {
                            type: string,
                            enum:
                              [idle, printing, paused, error, offline, unknown],
                          }
                        to:
                          {
                            type: string,
                            enum:
                              [idle, printing, paused, error, offline, unknown],
                          }
                  intervals:
                    type: array
                    items:
                      type: object
                      required: [from, until, state]
                      properties:
                        from: { type: integer }
                        until: { type: integer }
                        state:
                          {
                            type: string,
                            enum: [idle, printing, paused, error, gap, unknown],
                          }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /webhooks:
    get:
      operationId: listWebhooks
      tags: [Webhooks]
      summary: List the app's webhook subscriptions
      security:
        - clientCredentials: ['events:subscribe']
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of subscriptions.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
