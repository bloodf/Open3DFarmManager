  /inventory/spools/search:
    get:
      operationId: searchInventorySpools
      tags: [Inventory]
      summary: Rank matching spools in the OpenFarm library
      description: |
        Requires a farm-wide inventory grant and the spool usage runtime.
        Orders by Euclidean RGB distance, farm and local spool ID. Rows without
        an explicit Spoolman binding omit serviceId, serviceSpoolId and spoolKey.
      security:
        - clientCredentials: ['inventory:read']
      parameters:
        - $ref: '#/components/parameters/FarmIdFilter'
        - $ref: '#/components/parameters/Limit'
        - name: color
          in: query
          schema: { type: string, pattern: '^#?[0-9a-fA-F]{6}$' }
        - name: material
          in: query
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: availability
          in: query
          schema: { type: string, enum: [any, stored, loaded], default: any }
        - name: minRemainingGrams
          in: query
          schema: { type: number, minimum: 0 }
