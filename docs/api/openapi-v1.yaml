      description: |
        Read-only ledger of the printers covered by the grant: a farm-wide
        `inventory:read` grant covers every printer of the farm, a printer grant
        only its printer. Only printers with ledger entries are listed;
        pagination is by printer. `source` is `manual` for operator records and
        `measured` for what the Connector reported. Unknown stays unknown: a
