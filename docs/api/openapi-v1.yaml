  /jobs/{jobId}/actions:
    post:
      operationId: submitJobAction
      tags: [Actions]
      summary: Confirm an observed plate or control an API job run
      description: |
        Pause, resume and cancel require `control:basic` and are bound to the
        API job's original start envelope. The Connector refuses with
        `already-ended` or `run-mismatch` when it cannot verify the active run.
        `confirm_collection` requires `plates:confirm` and the current plate
        attempt ID. An uninitialized stopped Moonraker printer reports attempt
        ID `0` for initial operator clearance. Stale attempts are refused.
        The same idempotency key and body retrieve the original action.
      security:
        - clientCredentials: ['control:basic']
        - clientCredentials: ['plates:confirm']
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobActionRequest'
      responses:
        '202':
          description: Action accepted (new or replayed).
          headers:
            Location:
              $ref: '#/components/headers/Location'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
