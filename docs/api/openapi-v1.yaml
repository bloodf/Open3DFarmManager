openapi: 3.1.0
info:
  title: OpenFarm Integration API
  version: 1.0.0
  summary: Versioned API for third-party applications to observe and control a farm.
  description: |
    Contract for `/api/integrations/v1`. This file is the source of truth; the
    server publishes it unchanged (as JSON) at
    `/api/integrations/v1/openapi.json`. Versioning and deprecation rules are in
    `docs/INTEGRATION-API.md`.

    **Authentication.** Every operation except the spec and the token endpoint
    requires `Authorization: Bearer <access token>` issued by the OAuth 2.0
    client-credentials token endpoint. Session cookies are never accepted on
    these routes. Each token is bound to the app's grants: scope, farm and,
    optionally, printer. Changes to the grants covered by a token invalidate it.
    Sandbox apps are only ever granted sandbox farms.

    **Authorization.** A missing, expired, malformed or revoked token answers
    401 (`invalid-token`). A token lacking the operation's scope answers 403
    (`insufficient-scope`). A farm, printer, job, action or webhook outside the
    app's grants answers 404 (`not-found`) so that existence is not disclosed.

    **Errors.** Every error except those of the token endpoint is an RFC 9457
    `application/problem+json` document with a stable machine-readable `code`.
    Clients branch on `code`, never on `title` or `detail`.

    **Pagination.** List operations use opaque cursors: pass `cursor` from the
    previous page's `nextCursor`; `nextCursor` is `null` on the last page.
    Pages are stable under concurrent inserts.

    **Rate limits.** Each app has separate read (GET) and write (POST, DELETE)
    token buckets. Every authenticated response carries `RateLimit-Limit`,
    `RateLimit-Remaining` and `RateLimit-Reset` for the bucket the request
    consumed; a 429 also carries `Retry-After`.

    **Idempotency.** Creating a job or action requires an `Idempotency-Key`
    header. Retrying with the same key and the same body returns the original
    resource; the same key with a different body answers 409
    (`idempotency-key-reused`). Keys are kept for at least 24 hours.

    **Commands.** Jobs and actions are delivered to the printer's Connector as
    signed envelopes. The Connector alone decides whether to execute and
    refuses unsafe or unauthorized commands with a refusal code. The
    integrator is responsible for checking printer state before sending a
    command; a command whose delivery is uncertain is never retried
    automatically and ends as `outcome-unknown`.

    **Time.** All timestamps are integer milliseconds since the Unix epoch (UTC).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/integrations/v1
    description: This farm server
security:
  - clientCredentials: []
tags:
  - name: Meta
    description: The published contract.
  - name: Authentication
    description: OAuth 2.0 client-credentials tokens.
  - name: Farm link
    description: Intent registration, owner consent and grant redemption.
  - name: Printers
    description: Printers, their status, files and macros.
  - name: Inventory
    description: Read-only filament inventory mirrored from Spoolman.
  - name: Jobs
    description: Job history and API-submitted print jobs.
  - name: Actions
    description: Printer actions such as pause, resume and cancel.
  - name: Webhooks
    description: Signed event delivery subscriptions.
paths:
  /openapi.json:
    get:
      operationId: getOpenApiSpec
      tags: [Meta]
      summary: This specification as JSON
      description: Public; no authentication and no rate-limit headers.
      security: []
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/json:
              schema:
                type: object
        '4XX':
          description: |
            Client error outside this contract, such as a method other than
            GET or HEAD. No body is guaranteed.
  /oauth/token:
    post:
      operationId: createAccessToken
      tags: [Authentication]
      summary: Issue an access token (client credentials)
      description: |
        RFC 6749 section 4.4. The client authenticates with HTTP Basic
        (`client_secret_basic`) or with `client_id` and `client_secret` in the
        form body (`client_secret_post`), not both. Errors on this endpoint use
        the RFC 6749 error format, not problem+json. The token's lifetime is
        server configuration and is reported in `expires_in`.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Access token issued.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Malformed request, unsupported grant type or invalid scope.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: Unknown client, wrong secret or revoked credential.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            WWW-Authenticate:
              description: '`Basic realm="openfarm-integrations"`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '429':
          description: Too many token requests for this client.
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '503':
          description: Token issuance is temporarily unavailable.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
  /intents:
    post:
      operationId: registerIntent
      tags: [Farm link]
      summary: Register a farm-link intent
      description: |
        Registers an intent for the owner to consent to. Idempotent on
        `intentRef`: repeating an identical request returns the same
        `consentRef`; reusing `intentRef` with any different field answers 409
        `intent-conflict`. `expiresAtMs` must lie in the future and at most
        5 minutes ahead of the server clock, allowing 30 seconds of clock
        skew; otherwise 422 `intent-expired` or `intent-too-long`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntentRequest'
      responses:
        '200':
          description: Intent registered (or the identical intent already was).
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /grants/redeem:
    post:
      operationId: redeemGrant
      tags: [Farm link]
      summary: Redeem a consented intent for a grant
      description: |
        Answers `pending_consent` until the owner approves the intent, then
        issues exactly one grant per `requestId`, echoing `requestId`,
        `intentRef`, `clientId`, the expiry and the full scope. Repeating the
        same `requestId` returns the same answer. No grant is ever issued after
        the intent has expired (`intent-expired`), and a refused consent
        answers `consent_denied`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
      responses:
        '200':
          description: Pending, denied or granted.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /grants/receipt:
    post:
      operationId: getGrantReceipt
      tags: [Farm link]
      summary: Read the stored outcome of a redeem request
      description: |
        Returns the stored outcome of a redeem `requestId` for the lifetime of
        the grant. An unknown or no longer retained `requestId` answers 200
        with `status: absent`; a request whose consent is still open answers
        `pending_consent`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptRequest'
      responses:
        '200':
          description: The stored outcome.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /printers:
    get:
      operationId: listPrinters
      tags: [Printers]
      summary: List printers the app may read
      description: Only printers covered by a `printers:read` grant appear.
      security:
        - clientCredentials: ['printers:read']
      parameters:
        - $ref: '#/components/parameters/FarmIdFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of printers.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrinterPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /printers/{printerId}/status:
    get:
      operationId: getPrinterStatus
      tags: [Printers]
      summary: Latest observed status of a printer
      description: |
        From the server's latest-state projection. When nothing has been
        observed, or the last observation cannot be published, `state` is
        `unknown` and the optional readings are absent; values are never
        guessed.
      security:
        - clientCredentials: ['printers:read']
      parameters:
        - $ref: '#/components/parameters/PrinterId'
      responses:
        '200':
          description: The printer's latest status.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrinterStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /printers/{printerId}/files:
    get:
      operationId: listPrinterFiles
      tags: [Printers]
      summary: List files stored on a printer
      description: |
        Answered live by the printer's Connector. Printer families without file
        listing answer 422 `unsupported`; an unreachable Connector answers 503
        `connector-unavailable` and a Connector that does not answer in time
        answers 504 `connector-timeout`.
      security:
        - clientCredentials: ['files:read']
      parameters:
        - $ref: '#/components/parameters/PrinterId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of files.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrinterFilePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /printers/{printerId}/macros:
    get:
      operationId: listPrinterMacros
      tags: [Printers]
      summary: List macros a printer exposes
      description: |
        Answered live by the printer's Connector. Families without macros
        answer 422 `unsupported`.
      security:
        - clientCredentials: ['control:extended']
      parameters:
        - $ref: '#/components/parameters/PrinterId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of macros.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MacroPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /printers/{printerId}/jobs:
    post:
      operationId: submitJob
      tags: [Jobs]
      summary: Submit a print job
      description: |
        Stores the job and either delivers it to the Connector or, when the
        grant requires operator approval, holds it (`held`). The server never
        downloads or stores the file: the Connector fetches `fileUrl` over
        HTTPS, verifies `sha256` and `sizeBytes`, uploads and starts. A
        retry with the same `Idempotency-Key` and body returns the same job.
      security:
        - clientCredentials: ['jobs:start']
      parameters:
        - $ref: '#/components/parameters/PrinterId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequest'
      responses:
        '202':
          description: Job accepted (new or replayed).
          headers:
            Location:
              $ref: '#/components/headers/Location'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /printers/{printerId}/actions:
    post:
      operationId: submitAction
      tags: [Actions]
      summary: Send a printer action
      description: |
        `pause`, `resume` and `cancel` require `control:basic`; every other
        action requires `control:extended`. An action the printer does not
        advertise answers 422 `unsupported` and is never delivered. Otherwise the action is delivered to the Connector or,
        when the grant requires approval, held. A retry with the same
        `Idempotency-Key` and body returns the same action.
      security:
        - clientCredentials: ['control:basic']
        - clientCredentials: ['control:extended']
      parameters:
        - $ref: '#/components/parameters/PrinterId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '202':
          description: Action accepted (new or replayed).
          headers:
            Location:
              $ref: '#/components/headers/Location'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /inventory:
    get:
      operationId: listInventory
      tags: [Inventory]
      summary: Latest Spoolman inventory snapshots
      description: |
        One entry per Connector that reported a snapshot, for farms covered by
        a farm-wide `inventory:read` grant. Snapshots are read-only display evidence.
      security:
        - clientCredentials: ['inventory:read']
      parameters:
        - $ref: '#/components/parameters/FarmIdFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of inventory snapshots.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /jobs:
    get:
      operationId: listJobHistory
      tags: [Jobs]
      summary: List ended jobs (job history)
      description: |
        Ended jobs from the farm's job history, newest first, for printers
        covered by a `jobs:read` grant. `since` and `until` filter on `endedAt`
        (inclusive, exclusive).
      security:
        - clientCredentials: ['jobs:read']
      parameters:
        - $ref: '#/components/parameters/FarmIdFilter'
        - name: printerId
          in: query
          description: Only entries of this printer.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: since
          in: query
          description: Only entries with `endedAt` at or after this time.
          schema:
            $ref: '#/components/schemas/TimestampMs'
        - name: until
          in: query
          description: Only entries with `endedAt` before this time.
          schema:
            $ref: '#/components/schemas/TimestampMs'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of job history entries.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobHistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /jobs/{jobId}:
    get:
      operationId: getJob
      tags: [Jobs]
      summary: Status of a job submitted through the API
      description: |
        `jobId` is the `id` returned by `submitJob`. The status comes from
        Connector results and job history only, never assumed, and moves
        forward only.
      security:
        - clientCredentials: ['jobs:read']
        - clientCredentials: ['jobs:start']
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The job.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /actions/{actionId}:
    get:
      operationId: getAction
      tags: [Actions]
      summary: Status of an action submitted through the API
      description: |
        The status comes from Connector results only, never assumed, and moves
        forward only.
      security:
        - clientCredentials: ['control:basic']
        - clientCredentials: ['control:extended']
      parameters:
        - name: actionId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The action.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /webhooks:
    get:
      operationId: listWebhooks
      tags: [Webhooks]
      summary: List the app's webhook subscriptions
      security:
        - clientCredentials: ['events:subscribe']
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of subscriptions.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createWebhook
      tags: [Webhooks]
      summary: Subscribe a URL to events
      description: |
        The target must be HTTPS. Loopback, link-local and private-network
        targets are refused (422 `unsafe-target`) unless the app is a sandbox
        app. Events are delivered only for farms and printers within the app's
        grants. The signing secret is returned once, in this response only.
      security:
        - clientCredentials: ['events:subscribe']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRequest'
      responses:
        '201':
          description: Subscription created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /webhooks/{webhookId}:
    delete:
      operationId: deleteWebhook
      tags: [Webhooks]
      summary: Remove a subscription
      description: Deliveries stop; events already in flight may still arrive once.
      security:
        - clientCredentials: ['events:subscribe']
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '204':
          description: Subscription removed.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /webhooks/{webhookId}/test:
    post:
      operationId: testWebhook
      tags: [Webhooks]
      summary: Queue a signed `webhook.test` delivery
      description: |
        Queues one `webhook.test` event for this subscription, signed and
        retried like any other event. No request body.
      security:
        - clientCredentials: ['events:subscribe']
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '202':
          description: Test event queued.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookTestQueued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
webhooks:
  printer.state_changed:
    post:
      operationId: onPrinterStateChanged
      summary: A printer's observed state changed
      description: Sent when `state` of a granted printer changes.
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookEventId'
        - $ref: '#/components/parameters/WebhookTimestamp'
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrinterStateChangedEvent'
      responses:
        '200':
          $ref: '#/components/responses/WebhookAccepted'
  job.status_changed:
    post:
      operationId: onJobStatusChanged
      summary: An API-submitted job changed status
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookEventId'
        - $ref: '#/components/parameters/WebhookTimestamp'
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobStatusChangedEvent'
      responses:
        '200':
          $ref: '#/components/responses/WebhookAccepted'
  action.status_changed:
    post:
      operationId: onActionStatusChanged
      summary: An API-submitted action changed status
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookEventId'
        - $ref: '#/components/parameters/WebhookTimestamp'
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionStatusChangedEvent'
      responses:
        '200':
          $ref: '#/components/responses/WebhookAccepted'
  job.ended:
    post:
      operationId: onJobEnded
      summary: A job ended on a printer (any origin)
      description: Sent when a job history entry is recorded, with filament usage when known.
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookEventId'
        - $ref: '#/components/parameters/WebhookTimestamp'
        - $ref: '#/components/parameters/WebhookSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobEndedEvent'
