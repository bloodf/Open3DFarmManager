  /environment/controls:
    get:
      operationId: listEnvironmentControls
      tags: [Environment]
      summary: Environment controls of granted printers
      description: |
        Drying program, smart plug and extraction controls per printer, each
        with its readiness from the Connector's last observation, the actions
        this app may request and the OpenFarm management link. Safety
        interlocks, plug setup and credential enrollment stay in OpenFarm.
        Extraction (the chamber fan) is the only qualified control today;
        smart plugs and drying programs report `unsupported` with
        `no-qualified-capability`. A reading older than 60 seconds is `stale`;
        an offline or never-observed printer is `not-ready`. Requires
        `environment:read` or `environment:control`; `actions` stays empty
        without `environment:control` on the printer. Pagination is by
        printer.
      security:
        - clientCredentials: ['environment:read']
        - clientCredentials: ['environment:control']
      parameters:
        - $ref: '#/components/parameters/FarmIdFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of printers with their environment controls.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentControlsPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /environment/controls/{printerId}/actions:
    post:
      operationId: submitEnvironmentControlAction
      tags: [Environment]
      summary: Request an environment control action
      description: |
        Requires `environment:control` on the printer; a printer outside the
        grants answers 404. A control without a qualified Connector capability,
        or a grant that requires owner approval, answers 422 `unsupported` with
        the OpenFarm `managementUrl` and sends nothing. A stale observation
        answers 409 `device-stale` and an offline, never-observed or failed
        printer 409 `device-not-ready`, also with `managementUrl` and without a
        command. Otherwise exactly one issuer-signed `environment:control`
        envelope is delivered once; the Connector enforces its interlocks (it
        never turns extraction off during a print) and refuses with a reason.
        A retry with the same `Idempotency-Key` and body returns the same
        action.
      security:
        - clientCredentials: ['environment:control']
      parameters:
        - $ref: '#/components/parameters/PrinterId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentControlRequest'
      responses:
        '202':
          description: Action accepted (new or replayed).
          headers:
            Location:
              $ref: '#/components/headers/Location'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentControlAction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /environment/controls/{printerId}/actions/{actionId}:
    get:
      operationId: getEnvironmentControlAction
      tags: [Environment]
      summary: Outcome of an environment control action
      description: |
        The status comes from Connector results only, never assumed, and moves
        forward only. `outcome` summarizes it: `accepted` when the Connector
        applied the command, `refused` or `unsupported` with the Connector's
        reason, `not-delivered` when it expired or lost its authority before
        delivery and `unknown` when the result could not be confirmed. Nothing
        is retried. An action of another printer or outside the grants answers
        404.
      security:
        - clientCredentials: ['environment:control']
      parameters:
        - $ref: '#/components/parameters/PrinterId'
        - name: actionId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The environment control action.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentControlAction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /environment/measurements:
