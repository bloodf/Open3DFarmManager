# Dedicated application PostgreSQL. Loopback-only; no credentials are committed.
# WARNING: POSTGRES_USER becomes a SUPERUSER. Use it for bootstrap only. Create a
# non-superuser migration owner and a separate application login role (see
# docs/DATABASE-MIGRATIONS.md, "Roles") and point the app at those, never at this account.
# Usage: set O3DFM_DB_PASSWORD (and optionally the others) then `docker compose up -d`.
name: ${COMPOSE_PROJECT_NAME:-open3dfarmmanager-app}
services:
  postgres:
    image: postgres:17@sha256:846a7ddaa67a4b354ae1d21087b683901aa6113a4ed626d3787cfbf6c85e3e07
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    stop_grace_period: 30s
    shm_size: 256m
    environment:
      POSTGRES_DB: ${O3DFM_DB_NAME:-open3dfarm}
      POSTGRES_USER: ${O3DFM_DB_USER:-open3dfarm_owner}
      POSTGRES_PASSWORD: ${O3DFM_DB_PASSWORD:?set O3DFM_DB_PASSWORD}
    ports:
      - '127.0.0.1:${O3DFM_DB_PORT:-5433}:5432'
    volumes:
      - app-db-data:/var/lib/postgresql/data
    networks: [app]
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
networks:
  app:
    name: ${COMPOSE_PROJECT_NAME:-open3dfarmmanager-app}-net
volumes:
  app-db-data:
    name: ${COMPOSE_PROJECT_NAME:-open3dfarmmanager-app}-data
