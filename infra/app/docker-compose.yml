# Dedicated application PostgreSQL. Loopback-only; no credentials are committed.
# WARNING: POSTGRES_USER becomes a SUPERUSER. Use it for bootstrap only. Create a
# non-superuser migration owner and a separate application login role (see
# docs/DATABASE-MIGRATIONS.md, "Roles") and point the app at those, never at this account.
# Usage: set O3DFM_DB_PASSWORD (and optionally the others) then `docker compose up -d`.
name: ${COMPOSE_PROJECT_NAME:-open3dfarmmanager-app}
services:
  app:
    image: ${O3DFM_APP_IMAGE:?set O3DFM_APP_IMAGE to an immutable release image}
    restart: unless-stopped
    env_file: ./app.env
    environment:
      NUXT_DATABASE_ENABLED: 'true'
      NUXT_DATABASE_MIGRATIONS: ${NUXT_DATABASE_MIGRATIONS:-apply}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    ports:
      - '127.0.0.1:${O3DFM_APP_PORT:-3000}:3000'
    networks: [app]
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
  postgres:
    image: postgres:17@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    stop_grace_period: 30s
    shm_size: 256m
    environment:
      POSTGRES_DB: ${O3DFM_DB_NAME:-open3dfarm}
      POSTGRES_USER: ${O3DFM_DB_USER:-open3dfarm_owner}
      POSTGRES_PASSWORD: ${O3DFM_DB_PASSWORD:?set O3DFM_DB_PASSWORD}
    ports:
      - '127.0.0.1:${O3DFM_DB_PORT:-5433}:5432'
    volumes:
      - app-db-data:/var/lib/postgresql/data
    networks: [app]
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
networks:
  app:
    name: ${COMPOSE_PROJECT_NAME:-open3dfarmmanager-app}-net
volumes:
  app-db-data:
    name: ${COMPOSE_PROJECT_NAME:-open3dfarmmanager-app}-data
