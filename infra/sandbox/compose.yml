x-node: &node
  image: node:24.22.3-bookworm-slim@sha256:873f586f3794f52281bd039bf02c048a0be08fde619338f9941bad1eb6b34530
  profiles: [sandbox]
  working_dir: /workspace
  user: '${SANDBOX_UID:?}:${SANDBOX_GID:?}'
  volumes:
    - ../..:/workspace:ro
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
services:
  postgres:
    image: postgres:17@sha256:97fb53376be3e4fb1a8a61421daa69dcc3bf2fa39bda3259f5245f9a455af1a9
    profiles: [sandbox]
    environment:
      POSTGRES_USER: sandbox_bootstrap
      POSTGRES_DB: sandbox
      POSTGRES_PASSWORD: ${SANDBOX_DB_PASSWORD:?}
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U sandbox_bootstrap -d sandbox']
      interval: 1s
      timeout: 3s
      retries: 30
    ports:
      - '127.0.0.1::5432'
    volumes:
      - database:/var/lib/postgresql/data
  klipper:
    extends:
      file: ../sim/docker-compose.yml
      service: sv06
    profiles: [sandbox]
    image: open3dfarmmanager-sandbox-klipper
    ports: !override
      - '127.0.0.1::7125'
    volumes: !override
      - klipper-data:/home/printer/printer_data
      - ../sim/sv06/moonraker.conf:/home/printer/example-configs/moonraker.conf:ro
    networks: !override [default]
  bambu:
    <<: *node
    command: [node, infra/sandbox/bambu.ts]
    environment:
      SANDBOX_BAMBU_ACCESS_CODE: ${SANDBOX_BAMBU_ACCESS_CODE:-}
    ports:
      - '127.0.0.1::9999'
  app:
    <<: *node
    command: [node, --env-file=/sandbox/app.env, infra/sandbox/app.ts]
    ports:
      - '127.0.0.1::3000'
    volumes: !override
      - ../..:/workspace:ro
      - ${SANDBOX_STATE:?}/app.env:/sandbox/app.env:ro
      - ${SANDBOX_STATE:?}/tls.crt:/sandbox/tls.crt:ro
      - ${SANDBOX_STATE:?}/tls.key:/sandbox/tls.key:ro
      - ${SANDBOX_STATE:?}/keys.json:/sandbox/keys.json:ro
  connector:
    <<: *node
    network_mode: service:bambu
    depends_on: [app, bambu, klipper]
    environment:
      NODE_EXTRA_CA_CERTS: /sandbox/tls.crt
    volumes: !override
      - ../..:/workspace:ro
      - ${SANDBOX_STATE:?}/tls.crt:/sandbox/tls.crt:ro
      - ${SANDBOX_STATE:?}/runtime.json:/sandbox/runtime.json:ro
      - ${SANDBOX_STATE:?}/credential.json:/sandbox/credential.json:ro
      - ${SANDBOX_STATE:?}/bambu-credential.json:/sandbox/bambu-credential.json:ro
      - ${SANDBOX_STATE:?}/connector-data:/sandbox/connector-data
    command:
      - node
      - packages/connector/dist/cli.js
      - run
      - --config
      - /sandbox/runtime.json
      - --credential-file
      - /sandbox/credential.json
      - --data-dir
      - /sandbox/connector-data
# database is bind-mounted under the sandbox state dir (not Docker's volume
# store); scripts/sandbox.ts creates and removes the directory.
volumes:
  database:
    driver_opts:
      type: none
      o: bind
      device: ${SANDBOX_STATE:?}/database
  klipper-data:
