# Simulator ONLY. Shared emulated pins do not model a physical toolchanger.
# Never install this configuration on hardware.
[include addons/basic_cartesian_kinematics.cfg]
[include addons/basic_macros.cfg]
[include addons/single_extruder.cfg]
[include addons/heater_bed.cfg]
[include addons/open3d-tools.cfg]

[mcu]
serial: /tmp/pseudoserial
restart_method: arduino

[printer]
kinematics: cartesian
max_velocity: 100
max_accel: 1000

[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]
[display_status]
[respond]

[save_variables]
filename: ~/printer_data/config/sim-variables.cfg
