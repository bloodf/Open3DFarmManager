# Additional simulated extruders share the emulator's existing electrical signals.
# These fixtures exercise API object enumeration and tool selection only.
[duplicate_pin_override]
pins: PB1, PB0, PD6, PD5, PA7

[extruder1]
step_pin: PB1
dir_pin: !PB0
enable_pin: !PD6
heater_pin: PD5
sensor_pin: PA7
sensor_type: EPCOS 100K B57560G104F
control: watermark
microsteps: 16
rotation_distance: 32
nozzle_diameter: 0.4
filament_diameter: 1.75
min_temp: 0
max_temp: 250

[extruder2]
step_pin: PB1
dir_pin: !PB0
enable_pin: !PD6
heater_pin: PD5
sensor_pin: PA7
sensor_type: EPCOS 100K B57560G104F
control: watermark
microsteps: 16
rotation_distance: 32
nozzle_diameter: 0.4
filament_diameter: 1.75
min_temp: 0
max_temp: 250

[extruder3]
step_pin: PB1
dir_pin: !PB0
enable_pin: !PD6
heater_pin: PD5
sensor_pin: PA7
sensor_type: EPCOS 100K B57560G104F
control: watermark
microsteps: 16
rotation_distance: 32
nozzle_diameter: 0.4
filament_diameter: 1.75
min_temp: 0
max_temp: 250

[gcode_macro T0]
gcode:
  ACTIVATE_EXTRUDER EXTRUDER=extruder
  SAVE_VARIABLE VARIABLE=active_tool VALUE=0

[gcode_macro T1]
gcode:
  ACTIVATE_EXTRUDER EXTRUDER=extruder1
  SAVE_VARIABLE VARIABLE=active_tool VALUE=1

[gcode_macro T2]
gcode:
  ACTIVATE_EXTRUDER EXTRUDER=extruder2
  SAVE_VARIABLE VARIABLE=active_tool VALUE=2

[gcode_macro T3]
gcode:
  ACTIVATE_EXTRUDER EXTRUDER=extruder3
  SAVE_VARIABLE VARIABLE=active_tool VALUE=3
